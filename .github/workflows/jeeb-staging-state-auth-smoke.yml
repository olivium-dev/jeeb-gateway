name: Jeeb staging state-auth smoke

"on":
  workflow_dispatch:
    inputs:
      confirm_restart:
        description: Type RESTART-JEEB-STAGING-GATEWAY to authorize one rolling restart
        required: true
        type: string
      state_route_mode:
        description: State route generation currently deployed on .20
        required: true
        default: versioned
        type: choice
        options:
          - versioned
          - unversioned

permissions:
  contents: read

concurrency:
  group: jeeb-staging-state-auth-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-22.04
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Require explicit restart confirmation
        env:
          CONFIRM_RESTART: ${{ inputs.confirm_restart }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_RESTART" = RESTART-JEEB-STAGING-GATEWAY ] || {
            echo '::error::Restart confirmation did not match.'
            exit 2
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.404

      - name: Prove every gateway state client has the credential handler
        run: |
          set -euo pipefail
          dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj \
            -c Release \
            --filter 'FullyQualifiedName~StateServiceCredentialProductionWiringTests' \
            --logger 'console;verbosity=normal'

      - name: Install pinned cloudflared and configure strict SSH
        env:
          SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_STAGING_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?JEEB_STAGING_SSH_HOST is required}"
          : "${SSH_USER:?JEEB_STAGING_DEPLOY_USER is required}"
          : "${SSH_PRIVATE_KEY:?JEEB_STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_STAGING_SSH_KNOWN_HOSTS is required}"
          curl -fsSL --retry 3 -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64.deb
          printf '%s  %s\n' \
            'c805c7c8102190c04dfc16e3b4cc4acc9007d5b19b3afbcd608ea6fed7645a43' \
            cloudflared.deb | sha256sum --check --strict
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          install -d -m 700 "$HOME/.ssh"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          {
            printf '%s\n' 'Host jeeb-staging'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  ProxyCommand cloudflared access ssh --hostname %h' \
              '  UserKnownHostsFile ~/.ssh/known_hosts' \
              '  StrictHostKeyChecking yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify host identity
        run: |
          set -euo pipefail
          ssh jeeb-staging 'set -eu
            [ "$(hostname -s)" = "olivium-ephemerals" ]
            ip -4 -o addr show scope global \
              | awk '\''{ split($4, address, "/"); print address[1] }'\'' \
              | grep -Fxq "192.168.2.20"'

      - name: Probe state auth, restart gateway once, and repeat
        env:
          STATE_ROUTE_MODE: ${{ inputs.state_route_mode }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            printf 'smoke_workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'run=%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'state_route_mode=%s\n' "$STATE_ROUTE_MODE"
            printf 'source_auth_tests=passed\n'
          } > evidence/state-auth-smoke.txt

          route_prefix=''
          [ "$STATE_ROUTE_MODE" = unversioned ] || route_prefix='v1/'

          remote_probe() {
            local phase=$1
            ssh jeeb-staging bash -se -- "$phase" "$route_prefix" <<'REMOTE' \
              | tee -a evidence/state-auth-smoke.txt
          set -euo pipefail
          phase=$1
          prefix=$2
          service=jeeb-staging-jeeb-gateway
          container=$(docker ps -q \
            --filter "label=com.docker.swarm.service.name=$service" | head -n 1)
          [ -n "$container" ] || { echo "$phase gateway_container=missing"; exit 10; }
          docker exec "$container" sh -eu -s -- "$phase" "$prefix" <<'CONTAINER'
          phase=$1
          prefix=$2
          token_file=/run/secrets/jeeb_state_service_token
          [ -s "$token_file" ] || { echo "$phase credential_file=missing"; exit 11; }
          base=http://jeeb-staging-jeeb-state-service:8080

          status() {
            auth_mode=$1
            path=$2
            if [ "$auth_mode" = owner ]; then
              token=$(cat "$token_file")
              output=$(wget -S -O /dev/null -T 5 \
                --header="Authorization: Bearer $token" \
                --header="X-Actor-Role: admin" \
                "$base/$path" 2>&1 || true)
            else
              output=$(wget -S -O /dev/null -T 5 \
                --header="X-Actor-Role: admin" \
                "$base/$path" 2>&1 || true)
            fi
            # BusyBox wget prints response status only to stderr. Never print the
            # command or token; retain only the final numeric status code.
            printf '%s\n' "$output" \
              | awk '/  HTTP\// { code=$2 } END { print code+0 }'
          }

          probe() {
            label=$1
            path=$2
            anonymous=$(status anonymous "$path")
            authenticated=$(status owner "$path")
            case "$anonymous" in 401|403) ;; *)
              echo "$phase $label anonymous=$anonymous authenticated=$authenticated result=FAIL"
              exit 12;;
            esac
            case "$authenticated" in 2??) ;; *)
              echo "$phase $label anonymous=$anonymous authenticated=$authenticated result=FAIL"
              exit 13;;
            esac
            echo "$phase $label anonymous=$anonymous authenticated=$authenticated result=PASS"
          }

          probe state "${prefix}state/idempotency/jeeb-staging-auth-smoke-missing"
          probe cases "${prefix}cases/00000000-0000-0000-0000-000000000001"
          probe case_outbox "${prefix}case-outbox/dead-letters?limit=1"
          probe audit "${prefix}audit-events?application=jeeb-gateway&limit=1"
          probe work "${prefix}work-items/latest?application=jeeb-gateway&kind=auth-smoke&subjectRef=sha256%3Aauth-smoke"
          CONTAINER
          REMOTE
          }

          remote_probe before_restart
          task_image_evidence() {
            ssh jeeb-staging 'set -eu
              container=$(docker ps -q \
                --filter "label=com.docker.swarm.service.name=jeeb-staging-jeeb-gateway" | head -n 1)
              [ -n "$container" ]
              printf "%s|%s\n" \
                "$(docker inspect --format "{{.Config.Image}}" "$container")" \
                "$(docker inspect --format "{{.Image}}" "$container")"'
          }
          before_image=$(ssh jeeb-staging \
            "docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' jeeb-staging-jeeb-gateway")
          case "$before_image" in *@sha256:*) ;; *)
            echo 'Gateway service image is not digest-pinned.' >&2
            exit 14;;
          esac
          ssh jeeb-staging bash -s -- jeeb-staging-jeeb-gateway "$before_image" \
            < scripts/verify-swarm-service-image.sh
          IFS='|' read -r before_task_image before_task_image_id <<< "$(task_image_evidence)"
          [ "$before_task_image" = "$before_image" ]
          [ -n "$before_task_image_id" ]
          before_task=$(ssh jeeb-staging \
            "docker service ps --filter desired-state=running --format '{{.ID}}' jeeb-staging-jeeb-gateway | head -n 1")
          ssh jeeb-staging \
            'docker service update --force --update-failure-action pause --detach=false --replicas 1 jeeb-staging-jeeb-gateway >/dev/null'
          after_image=$(ssh jeeb-staging \
            "docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' jeeb-staging-jeeb-gateway")
          after_task=$(ssh jeeb-staging \
            "docker service ps --filter desired-state=running --format '{{.ID}}' jeeb-staging-jeeb-gateway | head -n 1")
          [ "$before_image" = "$after_image" ]
          ssh jeeb-staging bash -s -- jeeb-staging-jeeb-gateway "$after_image" \
            < scripts/verify-swarm-service-image.sh
          [ -n "$before_task" ] && [ -n "$after_task" ] && [ "$before_task" != "$after_task" ]
          ssh jeeb-staging \
            '[ "$(docker service ls --filter name=jeeb-staging-jeeb-gateway --format "{{.Replicas}}")" = "1/1" ]'
          IFS='|' read -r after_task_image after_task_image_id <<< "$(task_image_evidence)"
          [ "$after_task_image" = "$after_image" ]
          [ "$after_task_image_id" = "$before_task_image_id" ]
          remote_probe after_restart
          printf 'runtime_image=%s\nrestart_task_changed=yes\nservice_replicas=1/1\n' \
            "$after_image" \
            >> evidence/state-auth-smoke.txt

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jeeb-staging-state-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/state-auth-smoke.txt
          if-no-files-found: error
          retention-days: 30
