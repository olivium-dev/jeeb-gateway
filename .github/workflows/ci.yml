name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  provider-boundary-gates:
    # Owner locks: the gateway must never target the retired .50 host and must
    # never receive an STT provider credential. Transcription crosses only the
    # voice-transcription-service boundary. Both scanners include adversarial
    # canaries, so a matcher that silently stops detecting its hazard also fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject banned gateway destinations
        run: bash scripts/check-no-50-server.sh
      - name: Validate Jeeb Firebase, Chat, and push ownership contract
        run: |
          python3 scripts/validate-jeeb-firebase-contract.py
          python3 scripts/validate-chat-b-activation-authority.py
          python3 scripts/test-chat-b-activation-cancellation-contract.py
          bash scripts/test-validate-firebase-service-account.sh
          python3 scripts/test-smoke-jeeb-firebase-token-exchange.py
          bash scripts/test-chat-b-activation-preflight.sh
      - name: Reject gateway provider-secret drift
        run: bash scripts/check-provider-secret-boundaries.sh
      - name: Lock staging authorized-WSS probe contract
        run: |
          bash scripts/check-staging-realtime-probe-contract.sh
          bash scripts/check-staging-probe-key-rotation-contract.sh

  stateless-gate:
    # R9 — reject database ownership and ratchet the reviewed transitional
    # owner/worker inventory (ADR-001-rev2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stateless-gate tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: R9 stateless-gateway gate
        run: bash scripts/check-stateless-gateway.sh

  gwdbx-flag-registry-gate:
    # G-22 — one flag per cutover: repo flag tokens must be contained by the
    # gwdbx A10 mode registry, and SUPERSEDED/retired names stay inactive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: G-22 gwdbx flag-registry gate
        run: bash scripts/check-gwdbx-flag-registry.sh

  nswag-freshness:
    # Regenerate the jeeb-state-service NSwag client from the committed spec and
    # fail if it drifts from the committed client (F5-style freshness gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"
      - name: Install NSwag CLI
        run: dotnet tool install -g NSwag.ConsoleCore --version 14.2.0
      - name: Regenerate jeeb-state-service client
        run: ~/.dotnet/tools/nswag run nswag-state.json
      - name: Fail on client drift
        run: |
          if ! git diff --quiet -- src/JeebGateway/Services/Clients/JeebStateServiceClient.cs; then
            echo "::error::JeebStateServiceClient.cs is stale — regenerate with 'nswag run nswag-state.json' and commit."
            git diff -- src/JeebGateway/Services/Clients/JeebStateServiceClient.cs | head -80
            exit 1
          fi
          echo "OK: jeeb-state-service NSwag client is fresh."

  nswag-otp-freshness:
    # JEB-1499: Regenerate the OTP service NSwag client from the committed spec
    # and fail if it drifts from the committed client (freshness gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NSwag.ConsoleCore 14.2.0 is a net8.0 tool whose process runtime is Net80.
      # The nswag-otp.json document therefore declares "runtime": "Net80" (matching
      # the working nswag-state job); setup .NET 8 so the toolchain is consistent.
      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"
      - name: Install NSwag CLI
        run: dotnet tool install -g NSwag.ConsoleCore --version 14.2.0
      - name: Regenerate OTP service client
        run: ~/.dotnet/tools/nswag run nswag-otp.json
      - name: Fail on client drift
        run: |
          if ! git diff --quiet -- src/JeebGateway/Services/Clients/ServiceOTPClient.cs; then
            echo "::error::ServiceOTPClient.cs is stale — regenerate with 'nswag run nswag-otp.json' and commit."
            git diff -- src/JeebGateway/Services/Clients/ServiceOTPClient.cs | head -80
            exit 1
          fi
          echo "OK: OTP service NSwag client is fresh."

  build-and-test:
    runs-on: ubuntu-latest
    env:
      TEST_SHARD_A_M: '(FullyQualifiedName~JeebGateway.IntegrationTests.A|FullyQualifiedName~JeebGateway.IntegrationTests.B|FullyQualifiedName~JeebGateway.IntegrationTests.C|FullyQualifiedName~JeebGateway.IntegrationTests.D|FullyQualifiedName~JeebGateway.IntegrationTests.E|FullyQualifiedName~JeebGateway.IntegrationTests.F|FullyQualifiedName~JeebGateway.IntegrationTests.G|FullyQualifiedName~JeebGateway.IntegrationTests.H|FullyQualifiedName~JeebGateway.IntegrationTests.I|FullyQualifiedName~JeebGateway.IntegrationTests.J|FullyQualifiedName~JeebGateway.IntegrationTests.K|FullyQualifiedName~JeebGateway.IntegrationTests.L|FullyQualifiedName~JeebGateway.IntegrationTests.M)'
      TEST_SHARD_REMAINDER: '(FullyQualifiedName!~JeebGateway.IntegrationTests.A&FullyQualifiedName!~JeebGateway.IntegrationTests.B&FullyQualifiedName!~JeebGateway.IntegrationTests.C&FullyQualifiedName!~JeebGateway.IntegrationTests.D&FullyQualifiedName!~JeebGateway.IntegrationTests.E&FullyQualifiedName!~JeebGateway.IntegrationTests.F&FullyQualifiedName!~JeebGateway.IntegrationTests.G&FullyQualifiedName!~JeebGateway.IntegrationTests.H&FullyQualifiedName!~JeebGateway.IntegrationTests.I&FullyQualifiedName!~JeebGateway.IntegrationTests.J&FullyQualifiedName!~JeebGateway.IntegrationTests.K&FullyQualifiedName!~JeebGateway.IntegrationTests.L&FullyQualifiedName!~JeebGateway.IntegrationTests.M)'

    steps:
      - uses: actions/checkout@v4

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"

      - name: Restore gateway (locked)
        run: dotnet restore src/JeebGateway/JeebGateway.csproj --locked-mode

      - name: Audit gateway dependency vulnerabilities
        run: |
          set -euo pipefail
          dotnet list src/JeebGateway/JeebGateway.csproj package \
            --vulnerable --include-transitive | tee vulnerability-audit.txt
          if grep -Fq 'has the following vulnerable packages' vulnerability-audit.txt; then
            echo '::error::The gateway dependency graph contains a known vulnerable package.'
            exit 1
          fi

      - name: Build
        run: dotnet build src/JeebGateway/JeebGateway.csproj -c Release --no-restore

      - name: Restore test project (locked)
        run: dotnet restore tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj --locked-mode

      - name: Build test project
        run: dotnet build tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-restore

      - name: Restore unit test project
        run: dotnet restore tests/JeebGateway.UnitTests/JeebGateway.UnitTests.csproj

      - name: Build unit test project
        run: dotnet build tests/JeebGateway.UnitTests/JeebGateway.UnitTests.csproj -c Release --no-restore

      - name: Run all unit tests
        run: >-
          dotnet test tests/JeebGateway.UnitTests/JeebGateway.UnitTests.csproj
          -c Release --no-build --no-restore --verbosity normal
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Verify test shards are disjoint and exhaustive
        run: |
          set -euo pipefail
          count_tests() {
            dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj \
              -c Release --no-build --no-restore --list-tests --verbosity quiet "$@" \
              | awk 'seen && /^    / { count++ } /The following Tests are available:/ { seen=1 } END { print count+0 }'
          }

          all_count=$(count_tests)
          a_m_count=$(count_tests --filter "$TEST_SHARD_A_M")
          remainder_count=$(count_tests --filter "$TEST_SHARD_REMAINDER")
          shard_sum=$((a_m_count + remainder_count))

          if (( all_count == 0 || a_m_count == 0 || remainder_count == 0 || shard_sum != all_count )); then
            echo "::error::Test shard coverage failed: all=$all_count A-M=$a_m_count remainder=$remainder_count sum=$shard_sum"
            exit 1
          fi
          echo "OK: test shards are disjoint and exhaustive (all=$all_count A-M=$a_m_count remainder=$remainder_count)."

      # Separate VSTest processes bound each shard's host/resource lifetime. A
      # single process previously received runner shutdown after thousands of
      # WebApplicationFactory cases even though no assertion had failed.
      - name: Test shard A-M
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-build --no-restore --verbosity normal --logger "trx;LogFileName=tests-a-m.trx" --filter "(Quarantine!=timeout-flake)&$TEST_SHARD_A_M"

      - name: Test shard remainder
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-build --no-restore --verbosity normal --logger "trx;LogFileName=tests-remainder.trx" --filter "(Quarantine!=timeout-flake)&$TEST_SHARD_REMAINDER"

      # Quarantined repeat timeout-flake victims still run, but cannot poison the merge baseline.
      - name: Quarantined timeout flakes (non-gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-restore --verbosity normal --logger "trx;LogFileName=quarantine.trx" --filter "Quarantine=timeout-flake"

      - name: Assert lock files stayed unchanged
        run: git diff --exit-code -- src/JeebGateway/packages.lock.json tests/JeebGateway.IntegrationTests/packages.lock.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the open-source gitleaks binary (Apache-2.0) instead of the
      # gitleaks/gitleaks-action@v2 marketplace action: that action requires a
      # paid GITLEAKS_LICENSE secret for organization repos and fails closed
      # ("missing gitleaks license") before it ever scans. The binary runs the
      # exact same engine, honours .gitleaks.toml, and needs no license.
      - name: Install gitleaks
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t jeeb-gateway:ci-${{ github.sha }} .

      - name: Verify health check endpoint exists in image
        run: |
          docker run -d --name gw-smoke -p 18080:8080 \
            -e ASPNETCORE_ENVIRONMENT="Testing" \
            -e DELIVERY_SERVICE_TOKEN="ci-smoke-delivery-token-not-for-prod-aaaaaaaaaaaa" \
            -e JeebJwt__SigningKey="ci-smoke-signing-key-not-for-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            -e JeebJwt__PhonePepper="ci-smoke-phone-pepper-not-for-prod-aaaaaaa" \
            -e Services__Auth__BaseUrl="http://auth-service:8080" \
            -e Services__Chat__BaseUrl="http://chat-service:8080" \
            -e Services__UserManagement__BaseUrl="http://user-management:8080" \
            -e Services__Wallet__BaseUrl="http://wallet-service:8080" \
            -e Services__Matching__BaseUrl="http://matching:8080" \
            -e Services__Notification__BaseUrl="http://notification-service:8080" \
            -e Services__Geolocation__BaseUrl="http://geolocation-service:8080" \
            -e PushNotificationServiceApi__BaseUrl="http://push-notification:8080" \
            -e Services__Delivery__BaseUrl="http://delivery-service:8080" \
            jeeb-gateway:ci-${{ github.sha }}
          sleep 5
          curl -sf http://localhost:18080/health/live || (docker logs gw-smoke && exit 1)
          docker stop gw-smoke
          docker rm gw-smoke

  chat-push-canary-selftest:
    # The outcome canary is only trustworthy if its own jq/bash logic is. This
    # runs offline: no network, no secret, no staging mutation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canary library + plan-mode contract
        run: bash scripts/canary/test-canary-lib.sh
