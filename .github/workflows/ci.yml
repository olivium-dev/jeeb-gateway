name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stateless-gate:
    # R9 — assert the gateway stays stateless (no DB) and inventory the
    # durable-domain rewire debt (ADR-001-rev2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R9 stateless-gateway gate
        run: bash scripts/check-stateless-gateway.sh

  nswag-freshness:
    # Regenerate the jeeb-state-service NSwag client from the committed spec and
    # fail if it drifts from the committed client (F5-style freshness gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install NSwag CLI
        run: dotnet tool install -g NSwag.ConsoleCore --version 14.2.0
      - name: Regenerate jeeb-state-service client
        run: ~/.dotnet/tools/nswag run nswag-state.json
      - name: Fail on client drift
        run: |
          if ! git diff --quiet -- src/JeebGateway/Services/Clients/JeebStateServiceClient.cs; then
            echo "::error::JeebStateServiceClient.cs is stale — regenerate with 'nswag run nswag-state.json' and commit."
            git diff -- src/JeebGateway/Services/Clients/JeebStateServiceClient.cs | head -80
            exit 1
          fi
          echo "OK: jeeb-state-service NSwag client is fresh."

  nswag-otp-freshness:
    # JEB-1499: Regenerate the OTP service NSwag client from the committed spec
    # and fail if it drifts from the committed client (freshness gate).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NSwag.ConsoleCore 14.2.0 is a net8.0 tool whose process runtime is Net80.
      # The nswag-otp.json document therefore declares "runtime": "Net80" (matching
      # the working nswag-state job); setup .NET 8 so the toolchain is consistent.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install NSwag CLI
        run: dotnet tool install -g NSwag.ConsoleCore --version 14.2.0
      - name: Regenerate OTP service client
        run: ~/.dotnet/tools/nswag run nswag-otp.json
      - name: Fail on client drift
        run: |
          if ! git diff --quiet -- src/JeebGateway/Services/Clients/ServiceOTPClient.cs; then
            echo "::error::ServiceOTPClient.cs is stale — regenerate with 'nswag run nswag-otp.json' and commit."
            git diff -- src/JeebGateway/Services/Clients/ServiceOTPClient.cs | head -80
            exit 1
          fi
          echo "OK: OTP service NSwag client is fresh."

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/JeebGateway/JeebGateway.csproj

      - name: Build
        run: dotnet build src/JeebGateway/JeebGateway.csproj -c Release --no-restore

      - name: Restore test project
        run: dotnet restore tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj

      # This production branch deploys only the browser CMS composition. The
      # repository still carries dormant mobile/legacy packs whose owners and
      # routes are deliberately excluded from the lean gateway; keep the PR gate
      # aligned with the same explicit essential surface as deployment.
      - name: Test essential CMS gateway
        run: bash scripts/test-essential-cms.sh

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the open-source gitleaks binary (Apache-2.0) instead of the
      # gitleaks/gitleaks-action@v2 marketplace action: that action requires a
      # paid GITLEAKS_LICENSE secret for organization repos and fails closed
      # ("missing gitleaks license") before it ever scans. The binary runs the
      # exact same engine, honours .gitleaks.toml, and needs no license.
      - name: Install gitleaks
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t jeeb-gateway:ci-${{ github.sha }} .

      - name: Verify health check endpoint exists in image
        run: |
          docker run -d --name gw-smoke -p 18080:8080 \
            -e Jwt__SigningKey="ci-smoke-signing-key-not-for-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            -e Jwt__PhonePepper="ci-smoke-phone-pepper-not-for-prod-aaaaaaa" \
            -e Jwt__Issuer="ci-smoke" \
            -e Jwt__Audience="ci-smoke" \
            -e AdminEvidence__TokenKey="ci-smoke-evidence-token-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            -e AdminOidc__Enabled="true" \
            -e AdminOidc__Issuer="https://identity.example.test" \
            -e AdminOidc__AuthorizationEndpoint="https://identity.example.test/authorize" \
            -e AdminOidc__TokenEndpoint="https://identity.example.test/token" \
            -e AdminOidc__JwksUri="https://identity.example.test/jwks" \
            -e AdminOidc__ClientId="ci-smoke-admin" \
            -e AdminOidc__ClientSecret="ci-smoke-secret" \
            -e AdminOidc__RedirectUri="https://admin.jeeb.example/gateway/admin/v1/auth/oidc/callback" \
            -e AdminOidc__StateProtectionKey="YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=" \
            -e AdminOidc__RoleMappings__support__0="ci-smoke-support" \
            -e FeatureFlags__UseUpstream__Otp="false" \
            -e Services__Auth__BaseUrl="http://auth-service:8080" \
            -e Services__Chat__BaseUrl="http://chat-service:8080" \
            -e Services__UserManagement__BaseUrl="http://user-management:8080" \
            -e UserManagementServiceApi__BaseUrl="http://user-management:8080" \
            -e Services__Wallet__BaseUrl="http://wallet-service:8080" \
            -e Services__Matching__BaseUrl="http://matching:8080" \
            -e Services__Notification__BaseUrl="http://notification-service:8080" \
            -e Services__Geolocation__BaseUrl="http://geolocation-service:8080" \
            -e Services__PushNotification__BaseUrl="http://push-notification:8080" \
            -e Services__Delivery__BaseUrl="http://delivery-service:8080" \
            -e JeebStateService__BaseUrl="http://jeeb-state-service:8080" \
            -e UnifiedPaymentGateway__BaseUrl="http://unified-payment-gateway:8080" \
            -e Settlements__CodOwnerVerified="true" \
            jeeb-gateway:ci-${{ github.sha }}
          sleep 5
          curl -sf http://localhost:18080/health/live || (docker logs gw-smoke && exit 1)
          docker stop gw-smoke
          docker rm gw-smoke
