name: jeeb-otp-fast-cutover

"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jeeb-staging-gateway-mutation
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
  REMOTE_DOCKER_CONFIG: .jeeb-deploy/gateway-otp-ghcr-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - name: Require designated owner
        env:
          REQUESTING_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [ "$REQUESTING_ACTOR" = oudaykhaled ]
          [ "$TRIGGERING_ACTOR" = oudaykhaled ]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = olivium-dev/jeeb-gateway ]
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF_PROTECTED" = true ]
          [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ]

      - name: Install cloudflared and configure strict SSH
        env:
          SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_STAGING_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?JEEB_STAGING_SSH_HOST is required}"
          : "${SSH_USER:?JEEB_STAGING_DEPLOY_USER is required}"
          : "${SSH_PRIVATE_KEY:?JEEB_STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_STAGING_SSH_KNOWN_HOSTS is required}"
          curl -fsSL --retry 3 -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64.deb
          printf '%s  %s\n' \
            c805c7c8102190c04dfc16e3b4cc4acc9007d5b19b3afbcd608ea6fed7645a43 \
            cloudflared.deb | sha256sum --check --strict
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          install -d -m 700 "$HOME/.ssh"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          {
            echo 'Host jeeb-staging'
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo '  IdentityFile ~/.ssh/id_ed25519'
            echo '  IdentitiesOnly yes'
            echo '  ProxyCommand cloudflared access ssh --hostname %h'
            echo '  StrictHostKeyChecking yes'
            echo '  UserKnownHostsFile ~/.ssh/known_hosts'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Assert exact staging service
        run: |
          set -euo pipefail
          ssh jeeb-staging 'set -euo pipefail
            [ "$(hostname -s)" = olivium-ephemerals ]
            hostname -I | tr " " "\n" | grep -Fxq 192.168.2.20
            docker service inspect jeeb-staging-jeeb-gateway >/dev/null
            [ "$(docker service inspect jeeb-staging-jeeb-gateway --format "{{.Spec.Mode.Replicated.Replicas}}")" = 1 ]
            [ "$(docker service inspect jeeb-staging-jeeb-gateway --format "{{range .Endpoint.Spec.Ports}}{{.PublishedPort}}:{{.TargetPort}}:{{.PublishMode}}{{end}}")" = 10000:8080:ingress ]'

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Capture build-produced digest
        id: immutable
        env:
          IMAGE_DIGEST: ${{ steps.image_build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE_REPOSITORY}@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Authenticate target to GHCR
        run: |
          set -euo pipefail
          ssh jeeb-staging "install -d -m 700 \"\$HOME/$REMOTE_DOCKER_CONFIG\""
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh jeeb-staging \
            "DOCKER_CONFIG=\"\$HOME/$REMOTE_DOCKER_CONFIG\" docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"

      - name: Update existing gateway service
        env:
          IMAGE: ${{ steps.immutable.outputs.image }}
          SERVICE_AUTH_KEY: ${{ secrets.JEEB_OTP_SERVICE_AUTH_KEY }}
        run: |
          set -euo pipefail
          : "${SERVICE_AUTH_KEY:?JEEB_OTP_SERVICE_AUTH_KEY is required}"
          [ "${#SERVICE_AUTH_KEY}" -ge 32 ]
          auth_secret="jeeb_staging_gateway_service_auth_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$SERVICE_AUTH_KEY" | ssh jeeb-staging "docker secret create '$auth_secret' - >/dev/null"
          unset SERVICE_AUTH_KEY

          ssh jeeb-staging bash -s -- "$IMAGE" "$REMOTE_DOCKER_CONFIG" "$auth_secret" <<'REMOTE'
          set -euo pipefail
          image=$1; docker_config=$2; auth_secret=$3
          export DOCKER_CONFIG="$HOME/$docker_config"
          service=jeeb-staging-jeeb-gateway
          [ "$(hostname -s)" = olivium-ephemerals ]
          hostname -I | tr ' ' '\n' | grep -Fxq 192.168.2.20
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          docker service inspect "$service" >/dev/null
          docker pull "$image" >/dev/null

          old_secret=$(docker service inspect "$service" --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{if eq .File.Name "jeeb_gateway_service_auth"}}{{.SecretName}}{{end}}{{end}}')
          set -- docker service update --image "$image" --with-registry-auth
          set -- "$@" --update-order start-first --update-failure-action rollback --update-monitor 20s
          set -- "$@" \
            --env-add Auth__Otp__ApplicationId=0d51afe1-499f-4a29-a55a-36d2dd223b05 \
            --env-add Auth__Otp__Phone__EnforceRegion=false \
            --env-add Services__ServiceOTP__BaseUrl=http://jeeb-staging-one-time-password:8080 \
            --env-add ServiceOTPApi__BaseUrl=http://jeeb-staging-one-time-password:8080 \
            --env-add ServiceAuth__Enabled=true \
            --env-add ServiceAuth__Caller=jeeb-gateway \
            --env-add ServiceAuth__SigningKeyFile=/run/secrets/jeeb_gateway_service_auth
          [ -z "$old_secret" ] || set -- "$@" --secret-rm "$old_secret"
          set -- "$@" \
            --secret-add "source=$auth_secret,target=jeeb_gateway_service_auth,uid=65532,gid=65532,mode=0400" \
            "$service"
          "$@"
          REMOTE

          ssh jeeb-staging bash -s -- jeeb-staging-jeeb-gateway "$IMAGE" \
            < scripts/verify-swarm-service-image.sh
          for attempt in $(seq 1 30); do
            if ssh jeeb-staging 'curl -fsS --max-time 5 http://127.0.0.1:10000/health/ready >/dev/null'; then
              exit 0
            fi
            sleep 4
          done
          exit 1
