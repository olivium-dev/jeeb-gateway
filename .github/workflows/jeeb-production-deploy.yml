name: jeeb-production-deploy

"on":
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type deploy-jeeb-production
        required: true
        type: string

permissions:
  checks: read
  contents: read
  packages: write

concurrency:
  group: jeeb-production-gateway-mutation
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
  REMOTE_DOCKER_CONFIG: .jeeb-deploy/ghcr-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Require protected production source and owner confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTING_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = olivium-dev/jeeb-gateway ]
          [ "$CONFIRM_PRODUCTION" = deploy-jeeb-production ] || {
            echo '::error::Production confirmation is incorrect.' >&2
            exit 64
          }
          [ "$REQUESTING_ACTOR" = oudaykhaled ] \
            && [ "$TRIGGERING_ACTOR" = oudaykhaled ] || {
              echo '::error::Production deploys require the designated owner.' >&2
              exit 65
            }
          : "${DEFAULT_BRANCH:?repository default branch is required}"
          [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ] || {
            echo '::error::Production deploys may run only from the default branch.' >&2
            exit 66
          }
          [ "$GITHUB_REF_PROTECTED" = true ] || {
            echo '::error::The production source branch must be protected.' >&2
            exit 67
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify checked-out immutable source
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ]

      - name: Require successful exact-SHA CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          checks=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")
          for required in \
            audit \
            build \
            build-and-test \
            'Gitleaks Secret Scan' \
            gwdbx-flag-registry-gate \
            nswag-freshness \
            nswag-otp-freshness \
            provider-boundary-gates \
            stateless-gate \
            docker; do
            state=$(jq -r --arg name "$required" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.started_at)
              | last
              | "\(.status):\(.conclusion)"
            ' <<<"$checks")
            [ "$state" = completed:success ] || {
              echo "::error::Exact-SHA check '$required' is not successful ($state)." >&2
              exit 69
            }
          done

      - name: Install cloudflared and configure strict SSH
        env:
          SSH_HOST: ${{ secrets.JEEB_PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_PRODUCTION_DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?JEEB_PRODUCTION_SSH_HOST is required}"
          : "${SSH_USER:?JEEB_PRODUCTION_DEPLOY_USER is required}"
          : "${SSH_PRIVATE_KEY:?JEEB_PRODUCTION_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_PRODUCTION_SSH_KNOWN_HOSTS is required}"
          curl -fsSL --retry 3 -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64.deb
          printf '%s  %s\n' \
            'c805c7c8102190c04dfc16e3b4cc4acc9007d5b19b3afbcd608ea6fed7645a43' \
            cloudflared.deb | sha256sum --check --strict
          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y
          install -d -m 700 "$HOME/.ssh"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo '::error::Known-hosts does not pin JEEB_PRODUCTION_SSH_HOST.' >&2
            exit 68
          }
          {
            printf '%s\n' 'Host jeeb-production'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  User %s\n' "$SSH_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  ProxyCommand cloudflared access ssh --hostname %h' \
              '  UserKnownHostsFile ~/.ssh/known_hosts' \
              '  StrictHostKeyChecking yes' \
              '  ConnectTimeout 20' \
              '  ServerAliveInterval 10' \
              '  ServerAliveCountMax 2'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Assert exact production host and canonical service
        run: |
          ssh jeeb-production 'set -euo pipefail
            [ "$(hostname -s)" = jeeb-production ] || exit 91
            approved_ip_count=$(ip -4 -o addr show scope global \
              | awk '\''{ split($4, address, "/"); print address[1] }'\'' \
              | grep -Fxc 192.168.2.120 || true)
            [ "$approved_ip_count" -eq 1 ] || exit 92
            [ "$(docker info --format "{{.Swarm.LocalNodeState}}")" = active ]
            [ "$(docker info --format "{{.Swarm.ControlAvailable}}")" = true ]
            service=jeeb-production-jeeb-gateway
            docker service inspect "$service" >/dev/null
            [ "$(docker service inspect "$service" --format "{{.Spec.EndpointSpec.Mode}}")" = vip ]
            [ "$(docker service inspect "$service" --format "{{.Spec.Mode.Replicated.Replicas}}")" = 1 ]
            ports=$(docker service inspect "$service" \
              --format "{{range .Endpoint.Spec.Ports}}{{.PublishedPort}}:{{.TargetPort}}:{{.PublishMode}}{{end}}")
            [ "$ports" = 10000:8080:ingress ]
            curl -fsS --max-time 5 http://127.0.0.1:10000/health/ready >/dev/null'

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Capture build-produced immutable digest
        id: immutable
        env:
          IMAGE_DIGEST: ${{ steps.image_build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Log remote Docker in to GHCR
        id: remote_ghcr_login
        run: |
          set -euo pipefail
          # Reject pre-existing or redirected credential paths before writing a token.
          # shellcheck disable=SC2029
          ssh jeeb-production "set -eu
            [ \"\$(readlink -f -- \"\$HOME\")\" = \"\$HOME\" ] || exit 98
            deploy_root=\"\$HOME/.jeeb-deploy\"
            credential_dir=\"\$HOME/$REMOTE_DOCKER_CONFIG\"
            [ \"\$credential_dir\" = \"\$deploy_root/ghcr-${{ github.run_id }}-${{ github.run_attempt }}\" ] || exit 97
            [ ! -L \"\$deploy_root\" ] || exit 98
            [ ! -e \"\$deploy_root\" ] || [ -d \"\$deploy_root\" ] || exit 98
            if [ ! -d \"\$deploy_root\" ]; then
              mkdir -m 700 -- \"\$deploy_root\"
            fi
            [ \"\$(readlink -f -- \"\$deploy_root\")\" = \"\$deploy_root\" ] || exit 98
            [ \"\$(stat -c '%u:%a' -- \"\$deploy_root\")\" = \"\$(id -u):700\" ] || exit 98
            [ ! -e \"\$credential_dir\" ] && [ ! -L \"\$credential_dir\" ] || exit 98
            mkdir -m 700 -- \"\$credential_dir\"
            [ ! -L \"\$credential_dir\" ] && [ -d \"\$credential_dir\" ]
            [ \"\$(readlink -f -- \"\$credential_dir\")\" = \"\$credential_dir\" ]
            [ \"\$(stat -c '%u:%a' -- \"\$credential_dir\")\" = \"\$(id -u):700\" ]"
          # shellcheck disable=SC2029
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh jeeb-production \
                "set -eu
                 [ \"\$(readlink -f -- \"\$HOME\")\" = \"\$HOME\" ] || exit 98
                 deploy_root=\"\$HOME/.jeeb-deploy\"
                 credential_dir=\"\$HOME/$REMOTE_DOCKER_CONFIG\"
                 [ ! -L \"\$deploy_root\" ] && [ -d \"\$deploy_root\" ] || exit 98
                 [ ! -L \"\$credential_dir\" ] && [ -d \"\$credential_dir\" ] || exit 98
                 [ \"\$(readlink -f -- \"\$deploy_root\")\" = \"\$deploy_root\" ] || exit 98
                 [ \"\$(readlink -f -- \"\$credential_dir\")\" = \"\$credential_dir\" ] || exit 98
                 [ \"\$(stat -c '%u:%a' -- \"\$deploy_root\")\" = \"\$(id -u):700\" ] || exit 98
                 [ \"\$(stat -c '%u:%a' -- \"\$credential_dir\")\" = \"\$(id -u):700\" ] || exit 98
                 DOCKER_CONFIG=\"\$credential_dir\" docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"

      - name: Update production gateway and verify production posture
        env:
          IMAGE: ${{ steps.immutable.outputs.image }}
        run: |
          set -euo pipefail
          ssh jeeb-production bash -s -- "$IMAGE" "$REMOTE_DOCKER_CONFIG" <<'REMOTE'
          set -euo pipefail
          image=$1
          remote_docker_config=$2
          service=jeeb-production-jeeb-gateway
          base_url=http://127.0.0.1:10000
          candidate_started=false
          health_cmd=$(cat <<'HEALTH'
          set -eu
          wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1
          HEALTH
          )

          cleanup_remote_credentials() {
            deploy_root="$HOME/.jeeb-deploy"
            credential_dir="$HOME/$remote_docker_config"
            case "$credential_dir" in
              "$HOME"/.jeeb-deploy/ghcr-*) ;;
              *) return 98 ;;
            esac
            [ "$(readlink -f -- "$HOME")" = "$HOME" ] || return 98
            [ ! -L "$deploy_root" ] && [ -d "$deploy_root" ] || return 98
            [ ! -L "$credential_dir" ] && [ -d "$credential_dir" ] || return 98
            [ "$(readlink -f -- "$deploy_root")" = "$deploy_root" ] || return 98
            [ "$(readlink -f -- "$credential_dir")" = "$credential_dir" ] || return 98
            [ "$(stat -c '%u:%a' -- "$deploy_root")" = "$(id -u):700" ] || return 98
            [ "$(stat -c '%u:%a' -- "$credential_dir")" = "$(id -u):700" ] || return 98
            rm -f -- "$credential_dir/config.json"
            rmdir -- "$credential_dir" 2>/dev/null || true
          }

          wait_for_readiness() {
            for attempt in $(seq 1 18); do
              if curl -fsS --max-time 5 "$base_url/health/ready" >/dev/null; then
                return 0
              fi
              if [ "$attempt" -eq 18 ]; then
                echo 'Production readiness did not become healthy.' >&2
                return 1
              fi
              sleep 5
            done
          }

          expect_404() {
            path=$1
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$base_url$path")
            [ "$code" = 404 ] || {
              echo "Expected 404 from $path, received $code." >&2
              return 1
            }
          }

          verify_production_posture() {
            service_env=$(docker service inspect "$service" \
              --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}')
            for required in \
              ASPNETCORE_ENVIRONMENT=Production \
              DOTNET_ENVIRONMENT=Production \
              SuperLogin__OpenMode=false \
              DemoUsers__Enabled=false \
              Features__DevEndpoints__Enabled=false \
              Features__Swagger__Enabled=false \
              Security__TokenMint__Enabled=true \
              TestControlPlane__Enabled=false; do
              [ "$(printf '%s\n' "$service_env" | grep -Fxc "$required")" -eq 1 ]
            done
            wait_for_readiness
            expect_404 /api/User/demo-users
            expect_404 /api/User/super-login/users
            expect_404 /swagger/v1/swagger.json
            expect_404 /swagger/index.html
            expect_404 /__test/clock
            dev_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "$base_url/dev/seed/user")
            [ "$dev_code" = 404 ] || {
              echo "Expected 404 from /dev/seed/user, received $dev_code." >&2
              return 1
            }
            mint_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              -X POST -H 'Content-Type: application/json' \
              --data '{"userId":"production-posture-probe"}' \
              "$base_url/auth/tokens")
            case "$mint_code" in
              401|403) ;;
              *)
                echo "Expected 401/403 from credential-less token mint, received $mint_code." >&2
                return 1
                ;;
            esac
          }

          fail_forward_only() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$candidate_started" = true ]; then
              echo 'Candidate failed production verification; the forward-only deployment result is preserved for inspection and repair.' >&2
              docker service inspect "$service" >/dev/null || exit 95
            fi
            cleanup_remote_credentials || true
            exit "$rc"
          }
          trap fail_forward_only EXIT

          candidate_started=true
          DOCKER_CONFIG="$HOME/$remote_docker_config" docker service update \
            --image "$image" \
            --with-registry-auth \
            --env-add ASPNETCORE_ENVIRONMENT=Production \
            --env-add DOTNET_ENVIRONMENT=Production \
            --env-add SuperLogin__OpenMode=false \
            --env-add DemoUsers__Enabled=false \
            --env-add Features__DevEndpoints__Enabled=false \
            --env-add Features__Swagger__Enabled=false \
            --env-add Security__TokenMint__Enabled=true \
            --env-add TestControlPlane__Enabled=false \
            --health-cmd "$health_cmd" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-start-period 20s \
            --health-retries 3 \
            --update-parallelism 1 \
            --update-order start-first \
            --update-monitor 30s \
            --update-failure-action pause \
            --update-max-failure-ratio 0 \
            --detach=false \
            "$service"
          verify_production_posture

          observed_image=$(docker service inspect "$service" \
            --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          [ "$observed_image" = "$image" ]
          cleanup_remote_credentials
          trap - EXIT
          REMOTE

      - name: Clean up isolated production Docker credentials
        if: ${{ always() && steps.remote_ghcr_login.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          # The run-scoped credential path is intentionally expanded by the runner.
          # shellcheck disable=SC2029
          ssh jeeb-production "set -eu
            [ \"\$(readlink -f -- \"\$HOME\")\" = \"\$HOME\" ] || exit 98
            deploy_root=\"\$HOME/.jeeb-deploy\"
            credential_dir=\"\$HOME/$REMOTE_DOCKER_CONFIG\"
            case \"\$credential_dir\" in \"\$HOME/.jeeb-deploy/ghcr-${{ github.run_id }}-${{ github.run_attempt }}\") ;; *) exit 97 ;; esac
            [ ! -L \"\$deploy_root\" ] && [ -d \"\$deploy_root\" ] || exit 98
            [ ! -L \"\$credential_dir\" ] || exit 98
            [ ! -e \"\$credential_dir\" ] || [ -d \"\$credential_dir\" ] || exit 98
            [ \"\$(readlink -f -- \"\$deploy_root\")\" = \"\$deploy_root\" ] || exit 98
            [ \"\$(stat -c '%u:%a' -- \"\$deploy_root\")\" = \"\$(id -u):700\" ] || exit 98
            if [ -d \"\$credential_dir\" ]; then
              [ \"\$(readlink -f -- \"\$credential_dir\")\" = \"\$credential_dir\" ] || exit 98
              [ \"\$(stat -c '%u:%a' -- \"\$credential_dir\")\" = \"\$(id -u):700\" ] || exit 98
              DOCKER_CONFIG=\"\$credential_dir\" docker logout ghcr.io >/dev/null 2>&1 || true
              rm -f -- \"\$credential_dir/config.json\"
              rmdir -- \"\$credential_dir\"
            fi
            [ ! -e \"\$credential_dir\" ]"
