name: temporary-encrypted-moderation-export

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-jeeb-staging-moderation-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - name: Configure strict Cloudflare SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.JEEB_STAGING_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.JEEB_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?JEEB_STAGING_SSH_HOST is required}"
          : "${SSH_USER:?JEEB_STAGING_DEPLOY_USER is required}"
          : "${SSH_KEY:?JEEB_STAGING_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_STAGING_SSH_KNOWN_HOSTS is required}"
          curl -fsSL --retry 3 -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y
          install -d -m 700 "$HOME/.ssh"
          if [[ "$SSH_KEY" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/jeeb_staging"
          else
            printf '%s' "$SSH_KEY" | base64 --decode > "$HOME/.ssh/jeeb_staging"
          fi
          chmod 600 "$HOME/.ssh/jeeb_staging"
          ssh-keygen -y -f "$HOME/.ssh/jeeb_staging" >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo '::error::Known-hosts secret does not pin the staging SSH hostname'
            exit 1
          }
          {
            echo 'Host jeeb-staging'
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile $HOME/.ssh/jeeb_staging"
            echo '  IdentitiesOnly yes'
            echo '  ProxyCommand cloudflared access ssh --hostname %h'
            echo '  StrictHostKeyChecking yes'
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Assert exact staging host
        shell: bash
        run: |
          set -euo pipefail
          test "$(ssh jeeb-staging hostname | tr -d '\r')" = 'olivium-ephemerals'
          ssh jeeb-staging "hostname -I | tr ' ' '\n' | grep -Fxq '192.168.2.20'"

      - name: Export read-only catalog and encrypt before upload
        id: export
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.JEEB_DATABASE_URL }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?JEEB_DATABASE_URL is required}"
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo 'JEEB_DATABASE_URL must be a PostgreSQL DSN' >&2; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *@192.168.2.20:*) ;;
            *) echo 'JEEB_DATABASE_URL must target staging PostgreSQL at 192.168.2.20' >&2; exit 1 ;;
          esac
          case "${DATABASE_URL%%\?*}" in
            */jeeb_gateway) ;;
            *) echo 'JEEB_DATABASE_URL must target the jeeb_gateway database' >&2; exit 1 ;;
          esac

          work=$(mktemp -d)
          plaintext="$work/moderation-catalog.json"
          encrypted="$RUNNER_TEMP/jeeb-moderation-${GITHUB_RUN_ID}.json.gpg"
          cleanup() {
            if command -v shred >/dev/null 2>&1; then
              find "$work" -type f -exec shred -u {} + 2>/dev/null || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          chmod 700 "$work"

          {
            printf 'DATABASE_URL=%q\n' "$DATABASE_URL"
            cat <<'REMOTE'
          set -euo pipefail
          psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          WITH source_items AS (
              SELECT id, name, category, description,
                     COALESCE(severity, 'block') AS severity,
                     active, created_by, updated_by, created_at, updated_at
              FROM prohibited_items
          ),
          current_version AS (
              SELECT CASE
                       WHEN COUNT(*) FILTER (WHERE active) = 0 THEN 'empty'
                       ELSE to_char(
                         MAX(updated_at) FILTER (WHERE active) AT TIME ZONE 'UTC',
                         'YYYY-MM-DD"T"HH24:MI:SS.US"0+00:00"'
                       )
                     END AS version_tag
              FROM source_items
          ),
          categories AS (
              SELECT COALESCE(jsonb_agg(category_json ORDER BY category_id), '[]'::jsonb) AS payload
              FROM (
                  SELECT category AS category_id,
                         jsonb_build_object(
                           'list_key', 'jeeb-prohibited-items',
                           'id', category,
                           'label_en', category,
                           'label_ar', category,
                           'description_en', '',
                           'description_ar', '',
                           'default_severity', 'block',
                           'keywords', jsonb_agg(
                             jsonb_build_object(
                               'id', id,
                               'value', name,
                               'description', description,
                               'language', 'en',
                               'severity', severity,
                               'active', active,
                               'created_by', created_by,
                               'updated_by', updated_by,
                               'created_at', to_char(created_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"'),
                               'updated_at', to_char(updated_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"')
                             ) ORDER BY id
                           )
                         ) AS category_json
                  FROM source_items
                  GROUP BY category
              ) grouped
          ),
          acknowledgements AS (
              SELECT COALESCE(jsonb_agg(
                       jsonb_build_object(
                         'catalog_key', 'jeeb-prohibited-items',
                         'consumer_key', 'jeeb-gateway',
                         'subject_ref', user_id,
                         'version_tag', lexicon_version,
                         'acknowledged_at', to_char(acknowledged_at AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"')
                       ) ORDER BY user_id, lexicon_version, acknowledged_at
                     ), '[]'::jsonb) AS payload
              FROM prohibited_item_acks
          )
          SELECT jsonb_build_object(
                   'categories', categories.payload,
                   'version_tags', jsonb_build_object('jeeb-prohibited-items', current_version.version_tag),
                   'acknowledgements', acknowledgements.payload
                 )
          FROM categories, current_version, acknowledgements;
          COMMIT;
          SQL
          REMOTE
          } | ssh jeeb-staging bash -se > "$plaintext"
          chmod 600 "$plaintext"

          jq -e '
            type == "object" and
            (.categories | type == "array" and length > 0) and
            (all(.categories[];
              .list_key == "jeeb-prohibited-items" and
              (.id | type == "string" and length > 0) and
              (.keywords | type == "array" and length > 0))) and
            ([.categories[].keywords[]] | length > 0) and
            (.version_tags["jeeb-prohibited-items"] | type == "string" and length > 0) and
            (.acknowledgements | type == "array")
          ' "$plaintext" >/dev/null

          category_count=$(jq '.categories | length' "$plaintext")
          keyword_count=$(jq '[.categories[].keywords[]] | length' "$plaintext")
          acknowledgement_count=$(jq '.acknowledgements | length' "$plaintext")
          fingerprint=$(sha256sum "$plaintext" | awk '{print $1}')

          cat > "$work/export-public.asc" <<'KEY'
          -----BEGIN PGP PUBLIC KEY BLOCK-----

          mQGNBGqEqpABDAC/CVsI+lmsbwjIdq0HdQy/6sRtOv/l7hVHKU37GmM5miTNXNRZ
          UB5CeQuslxGRs+JTK0F+0NodBibDy8bLGKmRS5acShAIdwSD1eYyLvVzYd+MMBsB
          jVEAI9zKvBy6oYM+w1rJ/l+6PLoL1jTq2/c5InKDK4/SWgrMJP5oXJ4LjOLXB+3J
          Oxy0TwoD5acp+yv/RiuiC+ci9N3cfGOWdBRtKuxSuk9qM3vys/5jMxPGqu8F/V2t
          23yIk5NcN1CxD57VhXmtNO3r0XrpnUm2eBYbodRlIVtIKzeOoI/pG0dKjE98r6J2
          Q5eLCF+imREw6TjQLZExDjhj6j+PdSKi8NtBoabCMAt4gcwkAKgLV3TOwV75vPEL
          tHUXJvXIiyaxNo1KZWinbenN45TfVUXxf0laBXJ8+D8nr3spvgKuHFNKGbSARyME
          ix0n/DNj3mfGpqTzLbu9IxAO0EgQKX/Yco5i33h+2nmzskXfT5ZPP7ikE9Ul7cDW
          sAB09dksnLHteFMAEQEAAbQ4SmVlYiBtb2RlcmF0aW9uIGV4cG9ydCAyMDI2LTA4
          LTE4IDxleHBvcnRAbG9jYWwuaW52YWxpZD6JAfMEEwEIAF0WIQRHruHmqOv5IfMW
          oCHxQk0j514iBwUCaoSqkBsUgAAAAAAEAA5tYW51MiwyLjUrMS4xMiwwLDMCGw0F
          CQABUYAFCwkIBwICIgIGFQoJCAsCBBYCAwECHgcCF4AACgkQ8UJNI+deIgdtMwv/
          Y2F+4uBZ+RvXTuFbmGs05tWpEX1P+X70OvRTGJs2IS2ouivUD//938lLsAS5izfm
          bLhunMqIbPLQw1koe9wvJNGIqNMifXVpGa384/KseKpxXw/5+z3/GqGO2+HIjY5g
          npIjro5wN8NZMS1VgFK0GJcbX27uMLdZu3K2Xth30aNrrFI+ICZ5C5+npge8Lyyn
          jfUxeBcwEAHYBLgyEyAXV0JIsKSuo6Eui+R8/QpxNYvCu4qYG0jIcC5CtD8M1ubc
          afECZuRIRR6NNueJdL68Pme6dULvP25hK4JjRhO6O5gjokFvIlU9KhRJ0GNxkr9q
          oQWLn/jekWQSS7+LYzH1BaygOIdR52mPua7P2+aA7p7PJQzaTgg5cf/2ijWJyxvT
          17ZV7peE552XS1FyoivEL7JMgWnU/HNWjpVHxOXwY2sTG1Je23mLNHHhcSxrweDW
          2ClRcsgoZ1tdXVUq3cTMrqAP0Qb1vKKajTK26Zj7FryB8KruaO7tB/k1eXOrAswY
          =sR2g
          -----END PGP PUBLIC KEY BLOCK-----
          KEY
          chmod 600 "$work/export-public.asc"
          install -d -m 700 "$work/gnupg"
          gpg --batch --homedir "$work/gnupg" --import "$work/export-public.asc" >/dev/null 2>&1
          gpg --batch --yes --homedir "$work/gnupg" --trust-model always \
            --recipient 47AEE1E6A8EBF921F316A021F1424D23E75E2207 \
            --output "$encrypted" --encrypt "$plaintext"
          chmod 600 "$encrypted"

          echo "catalog_key=jeeb-prohibited-items categories=$category_count keywords=$keyword_count acknowledgements=$acknowledgement_count sha256=$fingerprint"
          echo "artifact_path=$encrypted" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted source backup
        uses: actions/upload-artifact@v4
        with:
          name: jeeb-moderation-encrypted-${{ github.run_id }}
          path: ${{ steps.export.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove runner-side encrypted copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jeeb-moderation-${GITHUB_RUN_ID}.json.gpg"
