name: Deploy Jeeb gateway to MSI

on:
  workflow_dispatch:
    inputs:
      server_hostname:
        description: Cloudflare Access SSH hostname
        required: true
        default: jeeb-ssh.fds-1.com
      server_user:
        description: MSI SSH user
        required: true
        default: ec2-user
      listen_url:
        description: Loopback-only gateway listener
        required: true
        default: http://127.0.0.1:10090
      jwt_issuer:
        description: Gateway JWT issuer
        required: true
        default: https://jeeb.fds-1.com
      jwt_audience:
        description: Gateway JWT audience
        required: true
        default: jeeb-mobile
      oidc_issuer:
        description: Public HTTPS OIDC issuer
        required: true
      oidc_authorization_endpoint:
        description: OIDC authorization endpoint on the issuer origin
        required: true
      oidc_token_endpoint:
        description: OIDC token endpoint on the issuer origin
        required: true
      oidc_jwks_uri:
        description: OIDC JWKS endpoint on the issuer origin
        required: true
      oidc_client_id:
        description: OIDC client identifier
        required: true
      oidc_redirect_uri:
        description: Public CMS callback URL
        required: true
        default: https://backoffice.jeeb.fds-1.com/gateway/admin/v1/auth/oidc/callback
      oidc_required_acr:
        description: Optional space-separated accepted MFA ACR values; blank requires signed amr=mfa
        required: false
        default: ''
      oidc_support_group:
        description: Exact IdP group mapped to support
        required: false
        default: ''
      oidc_support_lead_group:
        description: Exact IdP group mapped to support_lead
        required: false
        default: ''
      oidc_operations_group:
        description: Exact IdP group mapped to operations
        required: false
        default: ''
      oidc_finance_viewer_group:
        description: Exact IdP group mapped to finance_viewer
        required: false
        default: ''
      oidc_finance_approver_group:
        description: Exact IdP group mapped to finance_approver
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-jeeb-gateway-msi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      RELEASE_ARCHIVE: gateway-${{ github.sha }}.tar.gz
      RUNTIME_ENV: gateway-${{ github.sha }}.env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate production inputs and secrets
        env:
          JWT_SIGNING_KEY: ${{ secrets.JEEB_JWT_SIGNING_KEY }}
          UMJWT_SIGNING_KEY: ${{ secrets.UMJWT_SIGNING_KEY }}
          ADMIN_EVIDENCE_TOKEN_KEY: ${{ secrets.ADMIN_EVIDENCE_TOKEN_KEY }}
          OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          OIDC_STATE_KEY: ${{ secrets.ADMIN_OIDC_STATE_PROTECTION_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_SSH_KNOWN_HOSTS }}
          LISTEN_URL: ${{ inputs.listen_url }}
          OIDC_SUPPORT_GROUP: ${{ inputs.oidc_support_group }}
          OIDC_SUPPORT_LEAD_GROUP: ${{ inputs.oidc_support_lead_group }}
          OIDC_OPERATIONS_GROUP: ${{ inputs.oidc_operations_group }}
          OIDC_FINANCE_VIEWER_GROUP: ${{ inputs.oidc_finance_viewer_group }}
          OIDC_FINANCE_APPROVER_GROUP: ${{ inputs.oidc_finance_approver_group }}
        run: |
          set -euo pipefail
          [ "${#JWT_SIGNING_KEY}" -ge 32 ] || { echo '::error::JEEB_JWT_SIGNING_KEY must be at least 32 characters'; exit 1; }
          [ "${#UMJWT_SIGNING_KEY}" -ge 32 ] || { echo '::error::UMJWT_SIGNING_KEY must be at least 32 characters'; exit 1; }
          [ "${#ADMIN_EVIDENCE_TOKEN_KEY}" -ge 32 ] || { echo '::error::ADMIN_EVIDENCE_TOKEN_KEY must be at least 32 characters'; exit 1; }
          [ -n "$OIDC_CLIENT_SECRET" ] || { echo '::error::ADMIN_OIDC_CLIENT_SECRET is required'; exit 1; }
          [ -n "$CF_ACCESS_CLIENT_ID" ] || { echo '::error::CLOUDFLARE_ACCESS_CLIENT_ID is required'; exit 1; }
          [ -n "$CF_ACCESS_CLIENT_SECRET" ] || { echo '::error::CLOUDFLARE_ACCESS_CLIENT_SECRET is required'; exit 1; }
          [ -n "$SSH_KNOWN_HOSTS" ] || { echo '::error::JEEB_SSH_KNOWN_HOSTS is required'; exit 1; }
          if [ -z "$OIDC_SUPPORT_GROUP" ] && [ -z "$OIDC_SUPPORT_LEAD_GROUP" ] \
             && [ -z "$OIDC_OPERATIONS_GROUP" ] && [ -z "$OIDC_FINANCE_VIEWER_GROUP" ] \
             && [ -z "$OIDC_FINANCE_APPROVER_GROUP" ]; then
            echo '::error::At least one exact OIDC role group is required'
            exit 1
          fi
          [[ "$LISTEN_URL" =~ ^http://127\.0\.0\.1:[0-9]{2,5}$ ]] \
            || { echo '::error::listen_url must be an HTTP 127.0.0.1 listener'; exit 1; }
          OIDC_STATE_KEY="$OIDC_STATE_KEY" python3 - <<'PY'
          import base64, os
          try:
              value = base64.b64decode(os.environ["OIDC_STATE_KEY"], validate=True)
          except Exception as error:
              raise SystemExit(f"::error::ADMIN_OIDC_STATE_PROTECTION_KEY is invalid base64: {error}")
          if len(value) != 32:
              raise SystemExit("::error::ADMIN_OIDC_STATE_PROTECTION_KEY must decode to exactly 32 bytes")
          PY

      - name: Test and publish immutable gateway artifact
        run: |
          set -euo pipefail
          bash scripts/test-essential-cms.sh
          bash scripts/check-stateless-gateway.sh
          dotnet publish src/JeebGateway/JeebGateway.csproj \
            --configuration Release --no-restore --output publish/gateway
          printf '%s\n' '${{ github.sha }}' > publish/gateway/GIT_COMMIT
          tar -C publish/gateway -czf "$RELEASE_ARCHIVE" .
          sha256sum "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"

      - name: Build sealed runtime environment
        env:
          JWT_SIGNING_KEY: ${{ secrets.JEEB_JWT_SIGNING_KEY }}
          UMJWT_SIGNING_KEY: ${{ secrets.UMJWT_SIGNING_KEY }}
          ADMIN_EVIDENCE_TOKEN_KEY: ${{ secrets.ADMIN_EVIDENCE_TOKEN_KEY }}
          OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          OIDC_STATE_KEY: ${{ secrets.ADMIN_OIDC_STATE_PROTECTION_KEY }}
          LISTEN_URL: ${{ inputs.listen_url }}
          JWT_ISSUER: ${{ inputs.jwt_issuer }}
          JWT_AUDIENCE: ${{ inputs.jwt_audience }}
          OIDC_ISSUER: ${{ inputs.oidc_issuer }}
          OIDC_AUTHORIZATION_ENDPOINT: ${{ inputs.oidc_authorization_endpoint }}
          OIDC_TOKEN_ENDPOINT: ${{ inputs.oidc_token_endpoint }}
          OIDC_JWKS_URI: ${{ inputs.oidc_jwks_uri }}
          OIDC_CLIENT_ID: ${{ inputs.oidc_client_id }}
          OIDC_REDIRECT_URI: ${{ inputs.oidc_redirect_uri }}
          OIDC_REQUIRED_ACR: ${{ inputs.oidc_required_acr }}
          OIDC_SUPPORT_GROUP: ${{ inputs.oidc_support_group }}
          OIDC_SUPPORT_LEAD_GROUP: ${{ inputs.oidc_support_lead_group }}
          OIDC_OPERATIONS_GROUP: ${{ inputs.oidc_operations_group }}
          OIDC_FINANCE_VIEWER_GROUP: ${{ inputs.oidc_finance_viewer_group }}
          OIDC_FINANCE_APPROVER_GROUP: ${{ inputs.oidc_finance_approver_group }}
        run: |
          set -euo pipefail
          append_env() {
            jq -nr --arg key "$1" --arg value "$2" '$key + "=" + ($value | @json)' >> "$RUNTIME_ENV"
          }
          append_optional() {
            [ -z "$2" ] || append_env "$1" "$2"
          }
          : > "$RUNTIME_ENV"
          append_env ASPNETCORE_ENVIRONMENT Production
          append_env ASPNETCORE_URLS "$LISTEN_URL"
          append_env Jwt__SigningKey "$JWT_SIGNING_KEY"
          append_env Jwt__Issuer "$JWT_ISSUER"
          append_env Jwt__Audience "$JWT_AUDIENCE"
          append_env UmJwt__SigningKey "$UMJWT_SIGNING_KEY"
          append_env UmJwt__Issuer user-management
          append_env UmJwt__Audience user-management
          append_env AdminEvidence__TokenKey "$ADMIN_EVIDENCE_TOKEN_KEY"
          append_env AdminOidc__Enabled true
          append_env AdminOidc__Issuer "$OIDC_ISSUER"
          append_env AdminOidc__AuthorizationEndpoint "$OIDC_AUTHORIZATION_ENDPOINT"
          append_env AdminOidc__TokenEndpoint "$OIDC_TOKEN_ENDPOINT"
          append_env AdminOidc__JwksUri "$OIDC_JWKS_URI"
          append_env AdminOidc__ClientId "$OIDC_CLIENT_ID"
          append_env AdminOidc__ClientSecret "$OIDC_CLIENT_SECRET"
          append_env AdminOidc__RedirectUri "$OIDC_REDIRECT_URI"
          append_env AdminOidc__StateProtectionKey "$OIDC_STATE_KEY"
          append_env AdminOidc__GroupClaim groups
          append_env AdminOidc__Scopes__0 openid
          append_env AdminOidc__Scopes__1 profile
          append_env AdminOidc__Scopes__2 email
          append_env AdminOidc__AllowedSigningAlgorithms__0 RS256
          append_env AdminOidc__AllowedSigningAlgorithms__1 ES256
          append_optional AdminOidc__RequiredAcrValues "$OIDC_REQUIRED_ACR"
          append_optional AdminOidc__RoleMappings__support__0 "$OIDC_SUPPORT_GROUP"
          append_optional AdminOidc__RoleMappings__support_lead__0 "$OIDC_SUPPORT_LEAD_GROUP"
          append_optional AdminOidc__RoleMappings__operations__0 "$OIDC_OPERATIONS_GROUP"
          append_optional AdminOidc__RoleMappings__finance_viewer__0 "$OIDC_FINANCE_VIEWER_GROUP"
          append_optional AdminOidc__RoleMappings__finance_approver__0 "$OIDC_FINANCE_APPROVER_GROUP"
          append_env Settlements__CodOwnerVerified true
          chmod 600 "$RUNTIME_ENV"
          if grep -Eq '^(GatewayPostgres|WalletPostgres|ConnectionStrings__Default|DATABASE_URL|JEEB_DATABASE_URL)' "$RUNTIME_ENV"; then
            echo '::error::Forbidden gateway database configuration was generated'
            exit 1
          fi

      - name: Configure Cloudflare Access SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_SSH_KNOWN_HOSTS }}
          SERVER_HOSTNAME: ${{ inputs.server_hostname }}
          SERVER_USER: ${{ inputs.server_user }}
        run: |
          set -euo pipefail
          [[ "$SERVER_HOSTNAME" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::invalid SSH hostname'; exit 1; }
          [ "$SERVER_USER" = ec2-user ] || { echo '::error::MSI deployment user must be ec2-user'; exit 1; }
          cloudflared_version=2026.5.2
          cloudflared_sha256=f7378c11f55a061b4f1f7d1bccdd07bdfd947ed95634c5f6f4ba71a20d5b1d1d
          curl -fsSL --retry 3 -o cloudflared-linux-amd64.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${cloudflared_version}/cloudflared-linux-amd64.deb"
          printf '%s  %s\n' "$cloudflared_sha256" cloudflared-linux-amd64.deb | sha256sum -c -
          sudo dpkg -i cloudflared-linux-amd64.deb || sudo apt-get install -f -y
          install -d -m 700 "$HOME/.ssh"
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > "$HOME/.ssh/id_ed25519"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$SERVER_HOSTNAME" -f "$HOME/.ssh/known_hosts" >/dev/null \
            || { echo '::error::JEEB_SSH_KNOWN_HOSTS does not pin the configured MSI hostname'; exit 1; }
          {
            printf '%s\n' 'Host jeeb-msi'
            printf '  HostName %s\n' "$SERVER_HOSTNAME"
            printf '  User %s\n' "$SERVER_USER"
            printf '%s\n' \
              '  IdentityFile ~/.ssh/id_ed25519' \
              '  ProxyCommand cloudflared access ssh --hostname %h' \
              '  UserKnownHostsFile ~/.ssh/known_hosts' \
              '  StrictHostKeyChecking yes'
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload release, environment, and unit
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          ssh jeeb-msi 'install -d -m 700 /home/ec2-user/iter5-native/incoming'
          scp "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" "$RUNTIME_ENV" \
            deploy/msi/jeeb-gateway.service \
            jeeb-msi:/home/ec2-user/iter5-native/incoming/

      - name: Activate native release with rollback
        env:
          LISTEN_URL: ${{ inputs.listen_url }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          printf -v remote_listen_url '%q' "$LISTEN_URL"
          ssh jeeb-msi "LISTEN_URL=$remote_listen_url bash -se" <<'REMOTE'
          set -euo pipefail
          root=/home/ec2-user/iter5-native
          sha='${{ github.sha }}'
          archive="$root/incoming/gateway-$sha.tar.gz"
          checksum="$archive.sha256"
          env_in="$root/incoming/gateway-$sha.env"
          unit_in="$root/incoming/jeeb-gateway.service"
          release="$root/releases/gateway-$sha"
          active="$root/publish/gateway"
          env_file="$root/env/gateway.env"
          previous=""
          env_had_previous=false
          unit_had_previous=false
          release_created=false
          mutation_started=false
          active_swapped=false
          finished=false
          rollback() {
            exit_status=$?
            [ "$finished" = true ] && return
            trap - EXIT
            if [ "$mutation_started" = false ]; then
              if [ "$release_created" = true ]; then
                case "$release" in
                  "$root/releases/gateway-$sha") rm -rf -- "$release" ;;
                esac
              fi
              exit "$exit_status"
            fi
            set +e
            if [ "$active_swapped" = true ]; then
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                ln -s "$previous" "$active.rollback-$sha"
                mv -Tf "$active.rollback-$sha" "$active"
              elif [ -L "$active" ]; then
                unlink "$active"
              fi
            fi
            if [ "$env_had_previous" = true ] && [ -f "$env_file.rollback-$sha" ]; then
              mv -f "$env_file.rollback-$sha" "$env_file"
            elif [ "$env_had_previous" = false ]; then
              rm -f "$env_file"
            fi
            if [ "$unit_had_previous" = true ] \
               && sudo test -f "/etc/systemd/system/jeeb-gateway.service.rollback-$sha"; then
              sudo mv -f "/etc/systemd/system/jeeb-gateway.service.rollback-$sha" \
                /etc/systemd/system/jeeb-gateway.service
            elif [ "$unit_had_previous" = false ]; then
              sudo systemctl disable jeeb-gateway.service >/dev/null 2>&1 || true
              sudo rm -f /etc/systemd/system/jeeb-gateway.service
            fi
            sudo systemctl daemon-reload || true
            if [ -L "$active" ]; then
              sudo systemctl restart jeeb-gateway.service || true
            else
              sudo systemctl stop jeeb-gateway.service || true
            fi
            case "$release" in
              "$root/releases/gateway-$sha") rm -rf -- "$release" ;;
            esac
            echo 'gateway activation failed; prior release restored' >&2
            exit "$exit_status"
          }
          trap rollback EXIT
          [ ! -L "$root" ] || { echo 'release root must not be a symlink' >&2; exit 1; }
          install -d -m 755 "$root/releases" "$root/publish" "$root/env"
          install -d -m 700 "$root/incoming"
          (cd "$root/incoming" && sha256sum -c "$(basename "$checksum")")
          if [ -L "$active" ]; then
            previous="$(readlink -f "$active")"
            [ -d "$previous" ] || { echo 'active gateway symlink target is invalid' >&2; exit 1; }
          elif [ -e "$active" ]; then
            echo 'active gateway path must be absent or an immutable-release symlink' >&2
            exit 1
          fi
          [ ! -e "$release" ] || { echo 'immutable release already exists' >&2; exit 1; }
          install -d -m 755 "$release"
          release_created=true
          tar -xzf "$archive" -C "$release"
          test "$(cat "$release/GIT_COMMIT")" = "$sha"
          if [ -f "$env_file" ]; then
            cp -p "$env_file" "$env_file.rollback-$sha"
            env_had_previous=true
          fi
          if sudo test -f /etc/systemd/system/jeeb-gateway.service; then
            sudo cp -p /etc/systemd/system/jeeb-gateway.service \
              "/etc/systemd/system/jeeb-gateway.service.rollback-$sha"
            unit_had_previous=true
          fi
          mutation_started=true
          install -m 600 "$env_in" "$env_file"
          sudo install -m 644 "$unit_in" /etc/systemd/system/jeeb-gateway.service
          ln -s "$release" "$active.next-$sha"
          mv -Tf "$active.next-$sha" "$active"
          active_swapped=true
          sudo systemctl daemon-reload
          sudo systemctl enable jeeb-gateway.service
          healthy=false
          if sudo systemctl restart jeeb-gateway.service; then
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "$LISTEN_URL/health/ready" >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
          fi
          if [ "$healthy" != true ]; then
            exit 1
          fi
          test "$(cat "$active/GIT_COMMIT")" = "$sha"
          sudo systemctl is-active --quiet jeeb-gateway.service
          rm -f "$env_file.rollback-$sha" "$archive" "$checksum" "$env_in" "$unit_in"
          sudo rm -f "/etc/systemd/system/jeeb-gateway.service.rollback-$sha"
          finished=true
          REMOTE

      - name: Report deployed commit
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          ssh jeeb-msi 'cat /home/ec2-user/iter5-native/publish/gateway/GIT_COMMIT'
