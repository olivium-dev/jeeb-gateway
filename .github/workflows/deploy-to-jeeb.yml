# Deploy to Jeeb — verified host-mode Docker Swarm deploy over the Cloudflare tunnel.
#
# Follows the olivium per-service deploy-to-<server>.yml pattern (workflow_dispatch
# + cloudflared SSH + ghcr image + docker service), hardened per the locked deploy
# policy (olivium-deployment/README.md):
#   * controlled deploy: update an existing digest-pinned service with automatic
#     rollback plus exact-incumbent manual recovery; never delete or create a service
#   * update order = stop-first: the published port uses mode=host on a
#     single-node swarm, so start-first deadlocks ("host-mode port already in use
#     on 1 node") because the old task still holds the host port. stop-first frees
#     the port first (brief blip), which is correct for host-mode single node.
#   * key-only SSH from a secret (fail-closed; no password in YAML, unlike legacy)
#   * registry creds via GitHub secrets, never inlined (no demo-password literals)
#   * HTTP health gate before disarming recovery; every failure restores and verifies
#     the exact incumbent digest
#
# This service is the stateless Jeeb gateway: a JWT BFF that aggregates owner
# services via configured HTTP boundaries. It receives no database credential
# and runs no schema migration.
#
# Required secrets (set org-selected to the Jeeb repos, or per-repo):
#   JEEB_SSH_PRIVATE_KEY    -- deploy private key authorized on the Jeeb swarm host
#   JEEB_JWT_SIGNING_KEY    -- gateway JWT signing key (injected as env on first create)
#   JEEB_JWT_PHONE_PEPPER   -- gateway phone-pepper secret (injected on first create)
#   JEEB_TOKEN_MINT_KEY     -- F3: privileged-caller key gating POST /auth/tokens.
#                              OPTIONAL — when unset, the gate falls back to the JWT
#                              signing key (a caller holding that key can already
#                              forge tokens, so reusing it adds no new attack surface
#                              while closing the *unauthenticated* mint hole). Set a
#                              dedicated value to rotate the mint credential
#                              independently of the JWT key. Injected via env-add on
#                              every deploy so the running gateway picks it up.
#   UMJWT_SIGNING_KEY       -- H-B5: the key user-management SIGNS its re-issued
#                              role-switch tokens with (UM Jwt:Key, iss=user-management).
#                              The gateway's "UserManagement" JwtBearer scheme VERIFIES
#                              UM-issued tokens with this key. Without it the gateway's
#                              UmJwt:SigningKey falls back to its OWN mint key (a DIFFERENT
#                              key), so every UM-issued token 401s (split-signer gap).
#                              Injected via env-add (UmJwt__SigningKey) on update + create.
#                              This is the leaked shared fleet key (known-debt #6); a
#                              fleet-wide rotation is tracked separately — do NOT reuse it
#                              as the gateway's own mint key (JeebJwt__SigningKey).
#   JEEB_STATE_SERVICE_TOKEN -- dedicated state-owner service credential. The
#                              workflow streams it into a versioned Swarm secret;
#                              it is never passed as an env value or command arg.
#   DELIVERY_SERVICE_TOKEN, NOTIFICATION_SERVICE_TOKEN -- dedicated owner
#                              credentials, mounted as rotating secret files.
#   BUNDLER_CMS_BEARER_TOKEN, PRIVATE_ARTIFACT_STORE_BEARER_TOKEN,
#   DATA_EXPORT_TOKEN_SIGNING_KEY, JEEB_GATEWAY_JOB_TOKEN -- likewise mounted
#                              as versioned Swarm secrets for stateless CMS and
#                              durable deletion/export execution.

name: Deploy to Jeeb

on:
  workflow_dispatch:
    inputs:
      # `registry` is a fixed constant (always ghcr.io); it is set as a job-level env
      # (REGISTRY) rather than a workflow_dispatch input so the dispatch input count
      # stays below GitHub's hard limit of 25.
      # 26 inputs makes the workflow un-dispatchable (HTTP 422 at dispatch time).
      #
      # FeatureFlags spine flags are NOT added as one-input-per-flag (that path hit the cap).
      # They are consolidated into the single generic `feature_flags` Key=Value map input
      # (declared below), parsed in the deploy job into FeatureFlags__* env vars. This added
      # ConversationAutoCreate (S05 H7/H9b) AND every future spine flag with ZERO new inputs —
      # the workflow can never re-hit the 25-input cap on flag growth. The former dedicated
      # `use_upstream_kyc`/`use_upstream_cdn` boolean inputs were folded into the map (net -2 +1),
      # leaving 24 inputs (one slot spare).
      service_name:    { description: 'Swarm service name',              required: true, default: 'jeeb-gateway' }
      internal_port:   { description: 'Container port',                  required: true, default: '8080' }
      external_port:   { description: 'Published host port (Jeeb swarm)',required: true, default: '10000' }
      health_path:     { description: 'HTTP health path',                required: true, default: '/api/health' }
      server_hostname: { description: 'Cloudflare tunnel hostname',      required: true, default: 'jeeb-ssh.fds-1.com' }
      server_user:     { description: 'SSH user',                        required: true, default: 'ec2-user' }
      jwt_issuer:                  { description: 'JWT issuer',                       required: true, default: 'https://jeeb.fds-1.com' }
      jwt_audience:                { description: 'JWT audience',                     required: true, default: 'jeeb-mobile' }
      # This workflow runs the gateway in a container. MSI's native-systemd
      # 127.0.0.1 values therefore cannot be copied here: loopback would resolve
      # inside the gateway container. Ambiguous destinations deliberately have no
      # default and the pre-build target guard below requires the operator to supply
      # a Swarm-reachable URL. The standalone matching-service leg is absent because
      # that authority was retired (JEBV4-220 / E25).
      chat_base_url:               { description: 'Chat service base URL (required; no inferred container target)',             required: true, default: '' }
      user_management_base_url:    { description: 'User-management base URL (required; no inferred container target)',          required: true, default: '' }
      wallet_base_url:             { description: 'Wallet service base URL (required; no inferred container target)',           required: true, default: '' }
      notification_base_url:       { description: 'Notification owner base URL (required; no inferred container target)',       required: true, default: '' }
      push_notification_base_url:  { description: 'Push-notification base URL (required; no inferred container target)',        required: true, default: '' }
      otp_base_url:                { description: 'OTP service base URL (required; no inferred container target)',              required: true, default: '' }
      delivery_base_url:           { description: 'Delivery service base URL (required; no inferred container target)',         required: true, default: '' }
      voice_transcription_base_url: { description: 'Voice-transcription owner URL (required; no inferred container target)',    required: true, default: '' }
      # Auth:Otp:ApplicationId — the Jeeb tenant's ApplicationRef GUID in the SHARED
      # one-time-password service (JEB-1516). AuthOtpController forwards it on every
      # SendOTP/ValidateOTP (reads OtpSignInOptions.ApplicationId at AuthOtpController.cs:96/148).
      # appsettings.Production.json:26 commits an intentionally-empty placeholder, documented to
      # be injected at deploy time per fleet law (live config via GHA, not committed). Without it
      # the gateway forwards an empty Guid => 502 on /v1/auth/otp/request + 401 on verify. Plain
      # (non-secret) GUID, so it is a workflow input, NOT a GitHub secret. Default = b05, the same
      # value seeded into jeeb-otpdb by the OTP deploy, so a no-arg dispatch wires the spine.
      otp_application_id:          { description: 'Auth__Otp__ApplicationId — Jeeb ApplicationRef in shared one-time-password', required: true, default: '0d51afe1-499f-4a29-a55a-36d2dd223b05' }
      # S03 / ADR-0004 — KYC + CDN BFF seam. The gateway is the only aggregator;
      # it proxies/composes the OWNING kyc-service (own jeeb_kyc PG, no sibling
      # calls) and the cdn-service signed-PUT broker, and on approve appends the
      # jeeber role in user-management. The flags remain default-on, but container
      # destinations must be supplied explicitly because the native MSI loopback
      # values are not reachable from this Swarm container.
      # These are plain (non-secret) base URLs + boolean flags, so workflow inputs,
      # not GitHub secrets. The values are also baked into appsettings.Production.json;
      # injecting them here makes the flag/host operator-controllable on every deploy.
      kyc_base_url:                { description: 'Services__Kyc__BaseUrl (required; no inferred container target)',            required: true, default: '' }
      cdn_base_url:                { description: 'Services__Cdn__BaseUrl and private-artifact origin (required)',              required: true, default: '' }
      state_base_url:              { description: 'JeebStateService__BaseUrl (required; no inferred container target)',         required: true, default: '' }
      # ADR-0008/0010 records this exact MSI LAN target and a live 2026-08-16
      # health observation. It is the only target here that is safe to prefill.
      bundler_cms_base_url:        { description: 'BUNDLER_CMS_BASE_URL (documented MSI LAN target)', required: true, default: 'http://192.168.2.39:10056/' }
      # ── GENERIC FeatureFlags map (the spine flag overlay) ──────────────────────────
      # GitHub caps workflow_dispatch at 25 inputs; this workflow already hit that cap once
      # (the fixed `registry` constant was moved to a job-level env to claw a slot back —
      # see line ~48). To keep adding spine FeatureFlags without ever re-hitting the cap, the
      # per-flag boolean inputs are CONSOLIDATED into this ONE generic map instead of one
      # input per flag. `feature_flags` is a comma-separated list of `Key=Value` pairs whose
      # Key is the LAST segment of a `FeatureFlags:<...>:Enabled` (or `FeatureFlags:UseUpstream:<...>`)
      # config path; the deploy job maps each to its full `FeatureFlags__*` env var and injects
      # it via --env-add on the same update-only host-mode rollout.
      #
      # This input REPLACES the former dedicated `use_upstream_kyc` / `use_upstream_cdn`
      # boolean inputs (net -2 +1 = 24 inputs, one slot spare). It is ADDITIVE and
      # backward-compatible:
      #   * Empty (DEFAULT '') => emit NO map-driven flag mutation. On `docker service update
      #     --image ...` every unlisted env var is PRESERVED, so a no-arg deploy leaves all
      #     FeatureFlags exactly as the running service had them.
      #   * Recognised keys (case-insensitive), each mapping to its env var:
      #       ConversationAutoCreate=<bool> -> FeatureFlags__ConversationAutoCreate__Enabled   (S05 H7/H9b / JEB-50)
      #       UseUpstreamKyc=<bool>         -> FeatureFlags__UseUpstream__Kyc                   (S03 / ADR-0004)
      #       UseUpstreamCdn=<bool>         -> FeatureFlags__UseUpstream__Cdn                   (S03 / ADR-0004)
      #       UseUpstreamOffer=<bool>       -> FeatureFlags__UseUpstream__Offer                 (S07 — auction/accept)
      #     NOTE: FeatureFlags__UseUpstream__Offer AND FeatureFlags__UseUpstream__Delivery are
      #     ALSO injected UNCONDITIONALLY =true on every deploy (see the dedicated --env-add
      #     lines in the update below), so S07 routes through
      #     UpstreamPendingOffersStore and S09/S13/S15 route through the canonical delivery
      #     state-machine (SM-1: Ordered/Picked/InTransit/AtDoor/Done, trigger-keyed PATCH,
      #     AtDoor OTP handover, settlement-on-Done) even when the map keys are omitted.
      #     Delivery is a settled authority and is not accepted as operator input;
      #     Offer remains in the map until its separate retirement.
      #     Future spine flags are added to the map's case table below — NO new input, NO cap risk.
      #   * `dev_endpoints` and `swagger_ui` keep dedicated inputs because their
      #     3-state semantics are load-bearing.
      #   * Unknown keys are IGNORED with a warning (fail-open on parse, never fail the deploy
      #     on a typo); a value other than true/false is rejected (guardrail: no silent garbage
      #     into an env var).
      # Example: feature_flags='ConversationAutoCreate=true' arms H7 broadcasting auto-create
      # while leaving Kyc/Cdn at their baked-true defaults.
      feature_flags:
        description: 'Generic FeatureFlags overlay: comma-separated Key=Value. Keys: ConversationAutoCreate, UseUpstreamKyc, UseUpstreamCdn, UseUpstreamOffer, UseUpstreamChat. Empty = preserve running flags. Delivery/Ratings authority and Heartbeat/DurableRequests environment locks are not operator inputs.'
        required: false
        default: ''
      # DEV-ONLY seed/inspect surface (/dev/*). This input is the ONLY supported way to
      # toggle Features__DevEndpoints__Enabled on the running gateway — never set it via a
      # manual `docker service update --env-add/--env-rm` from an operator shell, and never
      # commit `Features__DevEndpoints__Enabled=true` to any appsettings file. Three states:
      #   'preserve' (DEFAULT) => the deploy emits NO dev-flag mutation, so whatever the flag
      #                           currently is on the running service PERSISTS untouched. A
      #                           `docker service update --image ...` keeps all unlisted env
      #                           vars, so a normal no-arg deploy never changes /dev/*. A fresh
      #                           prod that never set the flag stays OFF (404); an environment
      #                           explicitly turned ON stays ON across redeploys. This is the
      #                           prod-safe AND footgun-free default.
      #   'true'                => env-add  Features__DevEndpoints__Enabled=true  (/dev/* ON).
      #   'false'               => env-rm   Features__DevEndpoints__Enabled       (scrub => 404).
      # Set 'true'/'false' ONLY when you intend to change the flag (e.g. arm/disarm the E2E
      # seeding harness). Applied additively on the same stop-first `docker service update`
      # that injects Security__TokenMint__*.
      dev_endpoints:
        description: 'DEV-only /dev/* flag (Features__DevEndpoints__Enabled). preserve (default) = leave as-is; true = enable; false = scrub (404).'
        required: false
        default: 'preserve'
        type: choice
        options:
          - 'preserve'
          - 'true'
          - 'false'
      # Swagger UI / OpenAPI surface (/swagger*). This input is the ONLY supported way to
      # toggle Features__Swagger__Enabled on the running gateway — never set it via a manual
      # `docker service update --env-add/--env-rm` from an operator shell, and never commit
      # `Features__Swagger__Enabled=true` to any appsettings file. jeeb.fds-1.com is PUBLIC, so
      # when ON the surface is ADMIN-ROLE-GATED in Program.cs (admin token => 200, non-admin
      # => 404); it is NEVER the open Development/Testing branch, and this input must NEVER be
      # used in place of flipping ASPNETCORE_ENVIRONMENT (which would open the unauthenticated
      # /dev + Swagger surface). Three states, mirroring dev_endpoints:
      #   'preserve' (DEFAULT) => emit NO swagger-flag mutation; whatever the running service has
      #                           PERSISTS untouched across a `docker service update --image ...`.
      #                           A fresh prod that never set the flag stays OFF (404).
      #   'true'                => env-add  Features__Swagger__Enabled=true  (/swagger* ON, admin-gated).
      #   'false'               => env-rm   Features__Swagger__Enabled       (scrub => 404).
      # Applied additively on the same stop-first `docker service update` as dev_endpoints.
      swagger_ui:
        description: 'Swagger /swagger* flag (Features__Swagger__Enabled). preserve (default) = leave as-is; true = enable (admin-gated, non-admin 404); false = scrub (404).'
        required: false
        default: 'preserve'
        type: choice
        options:
          - 'preserve'
          - 'true'
          - 'false'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-jeeb-jeeb-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/olivium-dev/jeeb-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Reject the staging bootstrap target
        env:
          REQUESTED_SERVICE: ${{ inputs.service_name }}
          REQUESTED_HOST: ${{ inputs.server_hostname }}
          STAGING_SSH_HOST: ${{ secrets.JEEB_STAGING_SSH_HOST }}
        run: |
          set -euo pipefail
          : "${REQUESTED_SERVICE:?service_name is required}"
          : "${REQUESTED_HOST:?server_hostname is required}"
          case "$REQUESTED_SERVICE" in
            *[!a-zA-Z0-9_.-]*)
              echo '::error::service_name contains unsupported characters' >&2
              exit 1
              ;;
          esac
          if [ "$REQUESTED_SERVICE" = jeeb-staging-jeeb-gateway ]; then
            echo '::error::The staging gateway can be changed only by jeeb-staging-deploy.yml bootstrap/activation phases' >&2
            exit 1
          fi
          if [ -n "$STAGING_SSH_HOST" ] && [ "$REQUESTED_HOST" = "$STAGING_SSH_HOST" ]; then
            echo '::error::The staging host can be changed only by staging-authorized workflows' >&2
            exit 1
          fi

      - name: Validate container-reachable upstream targets
        env:
          GATEWAY_TARGETS: |
            chat_base_url=${{ inputs.chat_base_url }}
            user_management_base_url=${{ inputs.user_management_base_url }}
            wallet_base_url=${{ inputs.wallet_base_url }}
            notification_base_url=${{ inputs.notification_base_url }}
            push_notification_base_url=${{ inputs.push_notification_base_url }}
            otp_base_url=${{ inputs.otp_base_url }}
            delivery_base_url=${{ inputs.delivery_base_url }}
            voice_transcription_base_url=${{ inputs.voice_transcription_base_url }}
            kyc_base_url=${{ inputs.kyc_base_url }}
            cdn_base_url=${{ inputs.cdn_base_url }}
            state_base_url=${{ inputs.state_base_url }}
            bundler_cms_base_url=${{ inputs.bundler_cms_base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import socket
          from urllib.parse import urlsplit

          banned_host = ".".join(("192", "168", "2", "50"))
          banned_ip = ipaddress.ip_address(banned_host)
          failures = []

          def parse_literal_ip(host):
              try:
                  parsed_ip = ipaddress.ip_address(host)
              except ValueError:
                  try:
                      parsed_ip = ipaddress.ip_address(socket.inet_ntoa(socket.inet_aton(host)))
                  except OSError:
                      return None
              if isinstance(parsed_ip, ipaddress.IPv6Address) and parsed_ip.ipv4_mapped:
                  return parsed_ip.ipv4_mapped
              return parsed_ip

          for raw in os.environ["GATEWAY_TARGETS"].splitlines():
              if not raw:
                  continue
              name, value = raw.split("=", 1)
              value = value.strip()
              if not value:
                  failures.append(f"{name} is required and has no safe inferred Swarm target")
                  continue

              parsed = urlsplit(value)
              host = (parsed.hostname or "").lower().rstrip(".")
              literal_ip = parse_literal_ip(host)
              if parsed.scheme not in {"http", "https"} or not host:
                  failures.append(f"{name} must be an absolute HTTP(S) URL")
              elif literal_ip == banned_ip:
                  failures.append(f"{name} targets the owner-banned legacy host")
              elif host == "localhost" or (literal_ip is not None and (literal_ip.is_loopback or literal_ip.is_unspecified)):
                  failures.append(f"{name} uses container-local loopback, not a host-reachable target")
              elif parsed.username or parsed.password:
                  failures.append(f"{name} must not embed credentials")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit("Refusing to build or deploy with unsafe upstream targets")

          print("All workflow-managed gateway targets are explicit and container-reachable.")
          PY

      - name: Install cloudflared + write deploy key
        env:
          SSH_HOST: ${{ inputs.server_hostname }}
          SSH_USER: ${{ inputs.server_user }}
          SSH_PRIVATE_KEY: ${{ secrets.JEEB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.JEEB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?server_hostname is required}"
          : "${SSH_USER:?server_user is required}"
          : "${SSH_PRIVATE_KEY:?JEEB_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?JEEB_SSH_KNOWN_HOSTS is required}"
          wget -q https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-amd64.deb
          printf '%s  %s\n' \
            'c805c7c8102190c04dfc16e3b4cc4acc9007d5b19b3afbcd608ea6fed7645a43' \
            cloudflared-linux-amd64.deb | sha256sum --check --strict
          sudo dpkg -i cloudflared-linux-amd64.deb || sudo apt-get install -f -y
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo '::error::JEEB_SSH_KNOWN_HOSTS does not pin the requested server_hostname' >&2
            exit 1
          }
          cat > ~/.ssh/config <<EOF
          Host jeeb
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Reject aliases for the staging bootstrap service
        env:
          REQUESTED_SERVICE: ${{ inputs.service_name }}
        run: |
          set -euo pipefail
          bash scripts/reject-staging-gateway-alias.sh "$REQUESTED_SERVICE"

      - name: Log in to GHCR (password via stdin)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push immutable image
        id: immutable
        run: |
          set -euo pipefail
          TAG="${IMAGE}:${GITHUB_SHA}"
          docker build -t "$TAG" .
          push_output="$(docker push "$TAG")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE}@$digest" >> "$GITHUB_OUTPUT"

      - name: Remote GHCR login (token via stdin pipe)
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh jeeb "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Verified host-mode deploy with exact recovery
        env:
          IMAGE_PATH: ${{ steps.immutable.outputs.image }}
          STATE_SERVICE_TOKEN: ${{ secrets.JEEB_STATE_SERVICE_TOKEN }}
          DELIVERY_OWNER_TOKEN: ${{ secrets.DELIVERY_SERVICE_TOKEN }}
          NOTIFICATION_OWNER_TOKEN: ${{ secrets.NOTIFICATION_SERVICE_TOKEN }}
          BUNDLER_CMS_TOKEN: ${{ secrets.BUNDLER_CMS_BEARER_TOKEN }}
          PRIVATE_ARTIFACT_TOKEN: ${{ secrets.PRIVATE_ARTIFACT_STORE_BEARER_TOKEN }}
          DATA_EXPORT_SIGNING_KEY: ${{ secrets.DATA_EXPORT_TOKEN_SIGNING_KEY }}
          GATEWAY_JOB_TOKEN: ${{ secrets.JEEB_GATEWAY_JOB_TOKEN }}
        run: |
          set -euo pipefail
          : "${STATE_SERVICE_TOKEN:?JEEB_STATE_SERVICE_TOKEN secret is required}"
          : "${DELIVERY_OWNER_TOKEN:?DELIVERY_SERVICE_TOKEN secret is required}"
          : "${NOTIFICATION_OWNER_TOKEN:?NOTIFICATION_SERVICE_TOKEN secret is required}"
          : "${BUNDLER_CMS_TOKEN:?BUNDLER_CMS_BEARER_TOKEN secret is required}"
          : "${PRIVATE_ARTIFACT_TOKEN:?PRIVATE_ARTIFACT_STORE_BEARER_TOKEN secret is required}"
          : "${DATA_EXPORT_SIGNING_KEY:?DATA_EXPORT_TOKEN_SIGNING_KEY secret is required}"
          : "${GATEWAY_JOB_TOKEN:?JEEB_GATEWAY_JOB_TOKEN secret is required}"
          [[ "$IMAGE_PATH" =~ @sha256:[0-9a-f]{64}$ ]]
          STATE_SECRET="jeeb_gateway_state_token_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          DELIVERY_SECRET="jeeb_gateway_delivery_token_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          NOTIFICATION_SECRET="jeeb_gateway_notification_token_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          BUNDLER_SECRET="jeeb_gateway_bundler_token_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          ARTIFACT_SECRET="jeeb_gateway_artifact_token_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          EXPORT_SECRET="jeeb_gateway_export_key_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          JOB_SECRET="jeeb_gateway_job_token_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          stream_secret() {
            # The generated secret name is intentionally expanded by the runner.
            # shellcheck disable=SC2029
            printf '%s' "$2" | ssh jeeb "docker secret create '$1' - >/dev/null"
          }
          stream_secret "$STATE_SECRET" "$STATE_SERVICE_TOKEN"
          stream_secret "$DELIVERY_SECRET" "$DELIVERY_OWNER_TOKEN"
          stream_secret "$NOTIFICATION_SECRET" "$NOTIFICATION_OWNER_TOKEN"
          stream_secret "$BUNDLER_SECRET" "$BUNDLER_CMS_TOKEN"
          stream_secret "$ARTIFACT_SECRET" "$PRIVATE_ARTIFACT_TOKEN"
          stream_secret "$EXPORT_SECRET" "$DATA_EXPORT_SIGNING_KEY"
          stream_secret "$JOB_SECRET" "$GATEWAY_JOB_TOKEN"
          unset STATE_SERVICE_TOKEN DELIVERY_OWNER_TOKEN NOTIFICATION_OWNER_TOKEN \
            BUNDLER_CMS_TOKEN PRIVATE_ARTIFACT_TOKEN \
            DATA_EXPORT_SIGNING_KEY GATEWAY_JOB_TOKEN
          # DEV-only /dev/* flag, controlled EXCLUSIVELY by the dev_endpoints input (3-state).
          # preserve (DEFAULT) => emit NO dev-flag arg. `docker service update --image ...`
          #                       preserves every unlisted env var, so the flag's current value
          #                       PERSISTS across this deploy. A normal no-arg deploy therefore
          #                       NEVER changes /dev/* — prod that never set it stays OFF (404),
          #                       an env explicitly armed stays ON. (Fixes the footgun where a
          #                       default-false deploy silently disabled /dev/*.)
          # true  => env-add  Features__DevEndpoints__Enabled=true  (endpoints ON)
          # false => env-rm   Features__DevEndpoints__Enabled       (scrub => endpoints OFF / 404)
          # Idempotent: env-add overwrites if present; `docker service update --env-rm` is a
          # no-op when the var is already absent, so an explicit false run never errors.
          # Applied on the same update command as Security__TokenMint__* => one stop-first,
          # rollback-on-failure rollout, never a separate out-of-band update.
          case "${{ inputs.dev_endpoints }}" in
            true)
              DEV_FLAG_ARG="--env-add Features__DevEndpoints__Enabled=true"
              echo "dev_endpoints=true     -> $DEV_FLAG_ARG  (/dev/* will be reachable)"
              ;;
            false)
              DEV_FLAG_ARG="--env-rm Features__DevEndpoints__Enabled"
              echo "dev_endpoints=false    -> $DEV_FLAG_ARG  (/dev/* will be scrubbed -> 404)"
              ;;
            *)
              DEV_FLAG_ARG=""
              echo "dev_endpoints=preserve -> (no dev-flag mutation; existing /dev/* state persists)"
              ;;
          esac
          # Swagger /swagger* flag, controlled EXCLUSIVELY by the swagger_ui input (3-state),
          # mirroring dev_endpoints. preserve => no mutation (current state persists across the
          # --image update). true => env-add (admin-gated /swagger* ON). false => env-rm (404).
          # Idempotent: env-add overwrites if present; --env-rm is a no-op when already absent.
          # Applied on the same stop-first update command as DEV_FLAG_ARG / TokenMint.
          case "${{ inputs.swagger_ui }}" in
            true)
              SWAGGER_FLAG_ARG="--env-add Features__Swagger__Enabled=true"
              echo "swagger_ui=true     -> $SWAGGER_FLAG_ARG  (/swagger* ON, admin-role-gated; non-admin 404)"
              ;;
            false)
              SWAGGER_FLAG_ARG="--env-rm Features__Swagger__Enabled"
              echo "swagger_ui=false    -> $SWAGGER_FLAG_ARG  (/swagger* will be scrubbed -> 404)"
              ;;
            *)
              SWAGGER_FLAG_ARG=""
              echo "swagger_ui=preserve -> (no swagger-flag mutation; existing /swagger* state persists)"
              ;;
          esac
          # ── Generic FeatureFlags map parser ────────────────────────────────────────────
          # Parse the `feature_flags` comma-separated Key=Value overlay into --env-add args.
          # Each recognised key maps to its full FeatureFlags__* env var. Empty input => no
          # args, so a no-arg deploy preserves the running flags. Value must be true/false.
          # Unknown keys warn-and-skip (never fail the deploy on a typo). This replaces the former dedicated
          # FeatureFlags__UseUpstream__Kyc/Cdn injections (now expressible via the map).
          FEATURE_FLAG_ARGS=""
          RAW_FLAGS="${{ inputs.feature_flags }}"
          if [ -n "$RAW_FLAGS" ]; then
            IFS=',' read -ra _PAIRS <<< "$RAW_FLAGS"
            for _pair in "${_PAIRS[@]}"; do
              # trim surrounding whitespace
              _pair="$(echo "$_pair" | xargs)"
              [ -z "$_pair" ] && continue
              _key="${_pair%%=*}"
              _val="${_pair#*=}"
              _key="$(echo "$_key" | xargs)"
              _val="$(echo "$_val" | xargs)"
              # guardrail: value MUST be true/false (no silent garbage into an env var)
              if [ "$_val" != "true" ] && [ "$_val" != "false" ]; then
                echo "::error::feature_flags: '$_key' has non-boolean value '$_val' (expected true|false)"; exit 1
              fi
              # case-insensitive key match -> full FeatureFlags__* env var name
              _lkey="$(echo "$_key" | tr '[:upper:]' '[:lower:]')"
              case "$_lkey" in
                conversationautocreate) _envvar="FeatureFlags__ConversationAutoCreate__Enabled" ;;
                useupstreamkyc)         _envvar="FeatureFlags__UseUpstream__Kyc" ;;
                useupstreamcdn)         _envvar="FeatureFlags__UseUpstream__Cdn" ;;
                useupstreamoffer)       _envvar="FeatureFlags__UseUpstream__Offer" ;;
                useupstreamchat)        _envvar="FeatureFlags__UseUpstream__Chat" ;;
                *) echo "::warning::feature_flags: ignoring unknown key '$_key'"; continue ;;
              esac
              FEATURE_FLAG_ARGS="$FEATURE_FLAG_ARGS --env-add ${_envvar}=${_val}"
              echo "feature_flags: $_key=$_val -> --env-add ${_envvar}=${_val}"
            done
          else
            echo "feature_flags=empty -> (no map-driven flag mutation; running flags / baked appsettings defaults preserved)"
          fi
          VERIFY_SWARM_SERVICE_IMAGE="$(base64 -w 0 scripts/verify-swarm-service-image.sh)"
          # The runner intentionally expands the versioned secret names and immutable
          # image before sending this single update-only script to the pinned host.
          # shellcheck disable=SC2087
          ssh jeeb bash -se <<EOF
          set -euo pipefail
          SVC='${{ inputs.service_name }}'; INT='${{ inputs.internal_port }}'; EXT='${{ inputs.external_port }}'
          HEALTH='${{ inputs.health_path }}'
          STATE_SECRET='$STATE_SECRET'
          DELIVERY_SECRET='$DELIVERY_SECRET'
          NOTIFICATION_SECRET='$NOTIFICATION_SECRET'
          BUNDLER_SECRET='$BUNDLER_SECRET'
          ARTIFACT_SECRET='$ARTIFACT_SECRET'
          EXPORT_SECRET='$EXPORT_SECRET'
          JOB_SECRET='$JOB_SECRET'
          REQUESTED_IMAGE='$IMAGE_PATH'
          # These keys came from the retired gateway-local matching and STT paths.
          # Remove them on every update so an older service spec cannot preserve a
          # banned destination or a provider credential after the source is fixed.
          retired_env_args=(
            --env-rm Services__Matching__BaseUrl
            --env-rm Services__Chat__BaseUrl
            --env-rm Services__UserManagement__BaseUrl
            --env-rm Services__Wallet__BaseUrl
            --env-rm Services__PushNotification__BaseUrl
            --env-rm UserManagementApi__BaseUrl
            --env-rm ServiceOTPApi__BaseUrl
            --env-rm Whisper__FakeTranscribe
            --env-rm Whisper__ApiKey
            --env-rm OPENAI_API_KEY
            --env-rm OLIVIUM_OPEN_AI_KEY
          )
          docker service inspect "\$SVC" >/dev/null 2>&1 || {
            echo 'Direct gateway deploy requires an incumbent digest-pinned service' >&2
            exit 1
          }
          [ "\$(docker service inspect "\$SVC" --format '{{.Spec.Mode.Replicated.Replicas}}')" = 1 ] || {
            echo 'Direct gateway service must retain exactly one replica' >&2
            exit 1
          }
          current_ports=\$(docker service inspect "\$SVC" \
            --format '{{range .Endpoint.Spec.Ports}}{{.PublishedPort}}:{{.TargetPort}}:{{.PublishMode}}{{end}}')
          [ "\$current_ports" = "\${EXT}:\${INT}:host" ] || {
            echo 'Direct gateway service must retain the approved host-mode port' >&2
            exit 1
          }
          previous_image=\$(docker service inspect "\$SVC" \
            --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          [[ "\$previous_image" =~ @sha256:[0-9a-f]{64}$ ]] || {
            echo 'Incumbent service image is not digest-pinned; recovery target is unsafe' >&2
            exit 1
          }
          rollback_armed=false
          rollback_on_failure() {
            local status=\$? current_image recovery_mode=automatic recovery_ok=true recovery_ready=false
            trap - EXIT
            set +e
            if [ "\$status" -ne 0 ] && [ "\$rollback_armed" = true ]; then
              current_image=\$(docker service inspect "\$SVC" \
                --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null)
              if [ "\$current_image" != "\$previous_image" ]; then
                recovery_mode=manual
                docker service rollback --detach=false "\$SVC" || recovery_ok=false
              fi
              [ "\$(docker service inspect "\$SVC" \
                --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null)" = "\$previous_image" ] \
                || recovery_ok=false
              for attempt in \$(seq 1 30); do
                if curl -fsS --max-time 5 "http://127.0.0.1:\${EXT}\${HEALTH}" >/dev/null; then
                  recovery_ready=true
                  break
                fi
                sleep 4
              done
              [ "\$recovery_ready" = true ] || recovery_ok=false
              if [ "\$recovery_ok" = true ]; then
                echo "Verified \${recovery_mode} recovery to \${previous_image##*@}" >&2
              else
                echo 'Exact-incumbent recovery verification failed' >&2
                status=97
              fi
            fi
            exit "\$status"
          }
          trap rollback_on_failure EXIT
          state_secret_args=()
          add_rotated_secret() {
            target="\$1"; source="\$2"
            format="{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{if eq .File.Name \"\$target\"}}{{.SecretName}}{{\"\\n\"}}{{end}}{{end}}"
            while IFS= read -r old_secret; do
              [ -z "\$old_secret" ] || state_secret_args+=(--secret-rm "\$old_secret")
            done < <(docker service inspect "\$SVC" --format "\$format")
            state_secret_args+=(--secret-add "source=\$source,target=\$target,uid=65532,gid=65532,mode=0400")
          }
          add_rotated_secret jeeb_state_service_token "\$STATE_SECRET"
          add_rotated_secret delivery_service_token "\$DELIVERY_SECRET"
          add_rotated_secret notification_service_token "\$NOTIFICATION_SECRET"
          add_rotated_secret bundler_cms_bearer_token "\$BUNDLER_SECRET"
          add_rotated_secret private_artifact_store_bearer_token "\$ARTIFACT_SECRET"
          add_rotated_secret data_export_token_signing_key "\$EXPORT_SECRET"
          add_rotated_secret jeeb_gateway_job_token "\$JOB_SECRET"
          [[ "\$REQUESTED_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          docker pull "\$REQUESTED_IMAGE"
          rollout=(
            --update-order stop-first
            --update-parallelism 1
            --update-monitor 20s
            --update-failure-action rollback
            --rollback-order stop-first
            --rollback-parallelism 1
            --rollback-monitor 20s
            --rollback-failure-action pause
          )
          rollback_armed=true
          docker service update --detach=false --replicas 1 --image "\$REQUESTED_IMAGE" --with-registry-auth \
              "\${rollout[@]}" \
              "\${retired_env_args[@]}" \
              --env-add Security__TokenMint__Enabled='true' \
              --env-add Security__TokenMint__Key='${{ secrets.JEEB_TOKEN_MINT_KEY }}' \
              --env-add Auth__Otp__ApplicationId='${{ inputs.otp_application_id }}' \
              --env-add UmJwt__SigningKey='${{ secrets.UMJWT_SIGNING_KEY }}' \
              --env-add UmJwt__Issuer='user-management' \
              --env-add UmJwt__Audience='user-management' \
              --env-add Services__Kyc__BaseUrl='${{ inputs.kyc_base_url }}' \
              --env-add Services__Cdn__BaseUrl='${{ inputs.cdn_base_url }}' \
              --env-add ChatServiceApi__BaseUrl='${{ inputs.chat_base_url }}' \
              --env-add UserManagementServiceApi__BaseUrl='${{ inputs.user_management_base_url }}' \
              --env-add WalletServiceApi__BaseUrl='${{ inputs.wallet_base_url }}' \
              --env-add PushNotificationServiceApi__BaseUrl='${{ inputs.push_notification_base_url }}' \
              --env-add Services__ServiceOTP__BaseUrl='${{ inputs.otp_base_url }}' \
              --env-add Services__Delivery__BaseUrl='${{ inputs.delivery_base_url }}' \
              --env-add Services__VoiceTranscription__BaseUrl='${{ inputs.voice_transcription_base_url }}' \
              --env-add ServiceNotificationClient__BaseUrl='${{ inputs.notification_base_url }}' \
              --env-add JeebStateService__BaseUrl='${{ inputs.state_base_url }}' \
              --env-add JeebStateService__ServiceTokenFile='/run/secrets/jeeb_state_service_token' \
              --env-add DELIVERY_SERVICE_TOKEN_FILE='/run/secrets/delivery_service_token' \
              --env-add ServiceNotificationClient__ServiceTokenFile='/run/secrets/notification_service_token' \
              --env-add BUNDLER_CMS_BASE_URL='${{ inputs.bundler_cms_base_url }}' \
              --env-add BUNDLER_CMS_BEARER_TOKEN_FILE='/run/secrets/bundler_cms_bearer_token' \
              --env-add PRIVATE_ARTIFACT_STORE_BASE_URL='${{ inputs.cdn_base_url }}' \
              --env-add PRIVATE_ARTIFACT_STORE_BEARER_TOKEN_FILE='/run/secrets/private_artifact_store_bearer_token' \
              --env-add DATA_EXPORT_TOKEN_SIGNING_KEY_FILE='/run/secrets/data_export_token_signing_key' \
              --env-add InternalJobAuth__TokenFile='/run/secrets/jeeb_gateway_job_token' \
              --env-add FeatureFlags__DurableRequests__Enabled='false' \
              --env-add FeatureFlags__Heartbeat__Enabled='false' \
              --env-add FeatureFlags__Heartbeat__ServiceAuthKey='${{ secrets.HEARTBEAT_SERVICE_AUTH_KEY }}' \
              --env-add FeatureFlags__UseUpstream__Offer='true' \
              --env-add FeatureFlags__UseUpstream__Delivery='true' \
              --env-add FeatureFlags__UseUpstream__Ratings='true' \
              --env-add FeatureFlags__UseUpstream__Chat='true' \
              --env-add FeatureFlags__UseUpstream__Voice='true' \
              $FEATURE_FLAG_ARGS \
              $DEV_FLAG_ARG \
              $SWAGGER_FLAG_ARG \
              "\${state_secret_args[@]}" \
              "\$SVC"
          [ "\$(docker service inspect "\$SVC" \
            --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')" = "\$REQUESTED_IMAGE" ] || {
            echo 'Deployed service spec does not match the requested immutable digest' >&2
            exit 1
          }
          current_ports=\$(docker service inspect "\$SVC" \
            --format '{{range .Endpoint.Spec.Ports}}{{.PublishedPort}}:{{.TargetPort}}:{{.PublishMode}}{{end}}')
          [ "\$current_ports" = "\${EXT}:\${INT}:host" ] || {
            echo 'Direct gateway host-mode port contract drifted during rollout' >&2
            exit 1
          }
          healthy=false
          for attempt in \$(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:\${EXT}\${HEALTH}" >/dev/null; then
              healthy=true
              break
            fi
            sleep 4
          done
          if [ "\$healthy" != true ]; then
            docker service ps --no-trunc "\$SVC" | head -n 8 || true
            exit 1
          fi
          printf '%s' '$VERIFY_SWARM_SERVICE_IMAGE' | base64 -d | bash -s -- "\$SVC" "\$REQUESTED_IMAGE"
          rollback_armed=false
          EOF
