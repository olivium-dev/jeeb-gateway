name: Build, Test & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/olivium-dev
  IMAGE_NAME: jeeb-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_SHARD_A_M: '(FullyQualifiedName~JeebGateway.IntegrationTests.A|FullyQualifiedName~JeebGateway.IntegrationTests.B|FullyQualifiedName~JeebGateway.IntegrationTests.C|FullyQualifiedName~JeebGateway.IntegrationTests.D|FullyQualifiedName~JeebGateway.IntegrationTests.E|FullyQualifiedName~JeebGateway.IntegrationTests.F|FullyQualifiedName~JeebGateway.IntegrationTests.G|FullyQualifiedName~JeebGateway.IntegrationTests.H|FullyQualifiedName~JeebGateway.IntegrationTests.I|FullyQualifiedName~JeebGateway.IntegrationTests.J|FullyQualifiedName~JeebGateway.IntegrationTests.K|FullyQualifiedName~JeebGateway.IntegrationTests.L|FullyQualifiedName~JeebGateway.IntegrationTests.M)'
      TEST_SHARD_REMAINDER: '(FullyQualifiedName!~JeebGateway.IntegrationTests.A&FullyQualifiedName!~JeebGateway.IntegrationTests.B&FullyQualifiedName!~JeebGateway.IntegrationTests.C&FullyQualifiedName!~JeebGateway.IntegrationTests.D&FullyQualifiedName!~JeebGateway.IntegrationTests.E&FullyQualifiedName!~JeebGateway.IntegrationTests.F&FullyQualifiedName!~JeebGateway.IntegrationTests.G&FullyQualifiedName!~JeebGateway.IntegrationTests.H&FullyQualifiedName!~JeebGateway.IntegrationTests.I&FullyQualifiedName!~JeebGateway.IntegrationTests.J&FullyQualifiedName!~JeebGateway.IntegrationTests.K&FullyQualifiedName!~JeebGateway.IntegrationTests.L&FullyQualifiedName!~JeebGateway.IntegrationTests.M)'

    steps:
      - uses: actions/checkout@v4

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"

      - name: Restore gateway (locked)
        run: dotnet restore src/JeebGateway/JeebGateway.csproj --locked-mode

      - name: Audit gateway dependency vulnerabilities
        run: |
          set -euo pipefail
          dotnet list src/JeebGateway/JeebGateway.csproj package \
            --vulnerable --include-transitive | tee vulnerability-audit.txt
          if grep -Fq 'has the following vulnerable packages' vulnerability-audit.txt; then
            echo '::error::The gateway dependency graph contains a known vulnerable package.'
            exit 1
          fi

      - name: Build
        run: dotnet build src/JeebGateway/JeebGateway.csproj -c Release --no-restore

      - name: Restore tests (locked)
        run: dotnet restore tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj --locked-mode

      - name: Build tests
        run: dotnet build tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-restore

      - name: Test shard A-M
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-build --no-restore --verbosity normal --filter "(Quarantine!=timeout-flake)&$TEST_SHARD_A_M"

      - name: Test shard remainder
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-build --no-restore --verbosity normal --filter "(Quarantine!=timeout-flake)&$TEST_SHARD_REMAINDER"

      # Quarantined repeat timeout-flake victims still run, but cannot poison the merge baseline.
      - name: Quarantined timeout flakes (non-gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-build --no-restore --verbosity normal --filter "Quarantine=timeout-flake"

      - name: Assert lock files stayed unchanged
        run: git diff --exit-code -- src/JeebGateway/packages.lock.json tests/JeebGateway.IntegrationTests/packages.lock.json

      - name: Publish
        run: dotnet publish src/JeebGateway/JeebGateway.csproj -c Release -o publish --no-build

  push-image:
    name: Build & Push Docker Image
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image pushed
        run: |
          echo "Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          # Verify image exists in registry
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} > /dev/null
          echo "✓ Image verified in GHCR"

      - name: Report immutable image
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════════════════╗"
          echo "║  Image Pushed to GHCR                                                      ║"
          echo "╚════════════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Image:    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
