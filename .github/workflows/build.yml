name: Build, Test & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/olivium-dev
  IMAGE_NAME: jeeb-gateway

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"

      - name: Restore gateway (locked)
        run: dotnet restore src/JeebGateway/JeebGateway.csproj --locked-mode

      - name: Audit gateway dependency vulnerabilities
        run: |
          set -euo pipefail
          dotnet list src/JeebGateway/JeebGateway.csproj package \
            --vulnerable --include-transitive | tee vulnerability-audit.txt
          if grep -Fq 'has the following vulnerable packages' vulnerability-audit.txt; then
            echo '::error::The gateway dependency graph contains a known vulnerable package.'
            exit 1
          fi

      - name: Build
        run: dotnet build src/JeebGateway/JeebGateway.csproj -c Release --no-restore

      - name: Restore tests (locked)
        run: dotnet restore tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj --locked-mode

      - name: Test
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-restore --verbosity normal --filter "Quarantine!=timeout-flake"

      # Quarantined repeat timeout-flake victims still run, but cannot poison the merge baseline.
      - name: Quarantined timeout flakes (non-gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dotnet test tests/JeebGateway.IntegrationTests/JeebGateway.IntegrationTests.csproj -c Release --no-restore --verbosity normal --filter "Quarantine=timeout-flake"

      - name: Assert lock files stayed unchanged
        run: git diff --exit-code -- src/JeebGateway/packages.lock.json tests/JeebGateway.IntegrationTests/packages.lock.json

      - name: Publish
        run: dotnet publish src/JeebGateway/JeebGateway.csproj -c Release -o publish --no-build

  push-image:
    name: Build & Push Docker Image
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.run_id }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image pushed
        run: |
          echo "Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}"
          
          # Verify image exists in registry
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }} > /dev/null
          echo "✓ Image verified in GHCR"

      - name: Output image tag
        run: |
          echo "image_tag=${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo ""
          echo "╔════════════════════════════════════════════════════════════════════════════╗"
          echo "║  Image Pushed to GHCR                                                      ║"
          echo "╚════════════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Image:    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}"
          echo "Latest:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""

  deploy-staging:
    name: Deploy to Staging
    needs: push-image
    # iter5 (2026-06-21): auto-deploy to the VPS swarm (jeeb.fds-1.com) DEFERRED to owner —
    # deploy is owner-gated. This gate stops a merge to main from auto-deploying to staging.
    # The image is still built+pushed to GHCR by the push-image job above (no VPS contact);
    # only this swarm deploy is held. Re-enable by restoring the original condition below:
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: ${{ false && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image_tag: ${{ needs.push-image.outputs.image_tag }}
    secrets: inherit
