# End-to-end chat + push OUTCOME canary; health checks cannot see this class.
# Rationale, config and the deploy-gate snippet: docs/runbooks/chat-push-canary.md.
name: Jeeb chat+push canary

"on":
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Gateway base URL to probe
        required: true
        default: https://app.jeeb.fds-1.com
        type: string
      timeout:
        description: Whole-run budget in seconds
        required: false
        default: '150'
        type: string
  workflow_call:
    inputs:
      base_url:
        description: Gateway base URL to probe
        required: true
        type: string
      timeout:
        description: Whole-run budget in seconds
        required: false
        default: '150'
        type: string
    secrets:
      JEEB_TOKEN_MINT_KEY:
        description: Mints the two canary bearers; the canary cannot run without it
        required: true
      JEEB_PUSH_INTERNAL_API_KEY:
        description: Reads push-notification's dispatch ledger when it is reachable
        required: false
      JEEB_FIREBASE_WEB_API_KEY:
        description: Enables the Firestore VisibleTo assertion as the jeeber uid
        required: false

permissions:
  contents: read

jobs:
  canary:
    if: github.repository == 'olivium-dev/jeeb-gateway'
    concurrency:
      group: jeeb-chat-push-canary-${{ inputs.base_url || 'https://app.jeeb.fds-1.com' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      JEEB_CANARY_BASE_URL: ${{ inputs.base_url || 'https://app.jeeb.fds-1.com' }}
      JEEB_CANARY_TIMEOUT: ${{ inputs.timeout || '150' }}
      JEEB_TOKEN_MINT_KEY: ${{ secrets.JEEB_TOKEN_MINT_KEY }}
      JEEB_PUSH_INTERNAL_API_KEY: ${{ secrets.JEEB_PUSH_INTERNAL_API_KEY }}
      JEEB_FIREBASE_WEB_API_KEY: ${{ secrets.JEEB_FIREBASE_WEB_API_KEY }}
      PUSH_LEDGER_BASE_URL: ${{ vars.JEEB_PUSH_LEDGER_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Self-test the canary before trusting its verdict
        run: bash scripts/canary/test-canary-lib.sh

      - name: Print the plan (no call is made, no secret is printed)
        run: bash scripts/canary/run.sh --base-url "$JEEB_CANARY_BASE_URL" --plan

      - name: Run the end-to-end chat+push canary
        run: |
          set -uo pipefail
          if [ -z "${JEEB_TOKEN_MINT_KEY:-}" ]; then
            echo "::error::JEEB_TOKEN_MINT_KEY is not available to this run — the canary cannot mint its bearers."
            exit 1
          fi
          bash scripts/canary/run.sh \
            --base-url "$JEEB_CANARY_BASE_URL" \
            --timeout "$JEEB_CANARY_TIMEOUT" \
            --execute
