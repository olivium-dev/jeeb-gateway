name: Forward-only authority audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test exact Swarm image verifier
        run: scripts/test-verify-swarm-service-image.sh
      - name: Reject deployment and authority reversion paths
        run: bash scripts/check-forward-only-authorities.sh
      - name: Test staging security-cutover boundaries
        run: |
          bash scripts/test-verify-staging-otp-verify-freeze.sh
          bash scripts/test-staging-gateway-security-cutover.sh
          bash scripts/test-staging-gateway-candidate-contract.sh
          bash scripts/check-staging-gateway-phase-contracts.sh
